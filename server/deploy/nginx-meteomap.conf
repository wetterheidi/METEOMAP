# MeteoMap API – in die bestehende nginx-Konfiguration einfügen
# Datei: /etc/nginx/sites-available/default  (oder windscope)
# Den folgenden location-Block innerhalb des server { } einfügen.

location /meteomap/ {
    proxy_pass         http://127.0.0.1:8001/meteomap/;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}
