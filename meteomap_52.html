        let inner = `<path d="${sPath}" stroke="${dust}" stroke-width="2.2" fill="none" stroke-linecap="round"/>` +
          `<line x1="17" y1="4" x2="17" y2="30" stroke="${dust}" stroke-width="2.2" stroke-linecap="round"/>`;
        if (isVC) return wxSvg(inner + vcParens(dust));
        return wxSvg(inner);
      }

      // DU - Nur das stehende S
      if (wx.includes('DU')) {
        const sPath = `M22,10 C22,5 12,5 12,11 C12,16 22,18 22,23 C22,29 12,29 12,24`;
        let inner = `<path d="${sPath}" stroke="${dust}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
        if (isVC) return wxSvg(inner + vcParens(dust));
        return wxSvg(inner);
      }

      return null;
    }

    // Wrapper: symbol in glowing box, or text fallback
    function wxMarkerContent(wxVal, opacity) {
      const svg = wxSymbolSVG(wxVal);
      if (!svg) {
        const c = paramColor('ww', wxVal);
        return { html: mkBox(wxVal.slice(0, 6), c.bg, c.fg), w: estW(wxVal.slice(0, 6)), h: 22 };
      }
      const wx = (wxVal || '').toUpperCase();
      let glowClr = '#444';
      if (wx.includes('TS') || wx.includes('FZ') || wx.includes('GR') || wx.includes('GS') || wx.includes('PL') || wx.includes('SQ'))
        glowClr = WX_CLR.haz;
      else if (wx.includes('SN') || wx.includes('IC') || wx.includes('SG') || wx.includes('BLSN'))
        glowClr = WX_CLR.snow;
      else if (wx.includes('RA') || wx.includes('DZ') || wx.includes('SH'))
        glowClr = WX_CLR.liq;
      else if (wx.includes('FG') || wx.includes('BR') || wx.includes('HZ'))
        glowClr = WX_CLR.fog;
      else if (wx.includes('DU') || wx.includes('SA') || wx.includes('DS') || wx.includes('SS'))
        glowClr = WX_CLR.dust;

      const html = `<div style="opacity:${opacity.toFixed(2)};background:rgba(8,12,20,.85);` +
        `border:1.5px solid ${glowClr};border-radius:4px;padding:1px 2px;` +
        `box-shadow:0 0 5px ${glowClr}66;cursor:pointer;">${svg}</div>`;
      return { html, w: 26, h: 26 };
    }

    // ═══════════════════════════════════════════════════════════════
    // MARKER CREATION
    // ═══════════════════════════════════════════════════════════════

    const centeredIcon = (html, w = 60, h = 22) =>
      L.divIcon({ html, className: '', iconSize: [w, h], iconAnchor: [w / 2, h / 2] });

    function mkBox(text, bg, fg, extra = '') {
      return `<div style="background:${bg};color:${fg};padding:2px 6px;border-radius:4px;
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    border:1px solid rgba(255,255,255,.22);box-shadow:0 2px 6px rgba(0,0,0,.55);
    cursor:pointer;white-space:nowrap;${extra}">${text}</div>`;
    }

    // Build a properly-sized Leaflet divIcon – avoids the overflow:hidden trap
    function mkDivIcon(html, w, h, opacity = 1.0) {
      return L.divIcon({
        html: `<div style="opacity:${opacity.toFixed(2)}">${html}</div>`,
        className: '',
        iconSize: [w, h],
        iconAnchor: [Math.round(w / 2), Math.round(h / 2)]
      });
    }

    // Estimate pixel width of text in JetBrains Mono 11px bold
    function estW(text) { return Math.round(text.length * 7.5 + 14); }
    function ageOpacity(ageMin) {
      if (ageMin <= 30) return 1.0;
      if (ageMin >= 90) return 0.35;
      return 1.0 - 0.65 * (ageMin - 30) / 60;
    }

    function createMarker(obs, params) {
      const pos = [obs.lat, obs.lon];
      const opacity = ageOpacity(obs._ageMin || 0);

      if (params.length === 1 && params[0] === 'wind_barb') {
        const val = extractVal(obs, 'wind_barb');
        const clr = barbColor();
        const svg = windBarbSVG(val.spd, val.dir, clr);
        const icon = L.divIcon({
          html: `<div style="opacity:${opacity.toFixed(2)}">${svg}</div>`,
          className: '', iconSize: [50, 50], iconAnchor: [25, 25]
        });
        return buildMarker(pos, icon, obs);

      } else if (params.length === 2 && params.includes('wind_barb')) {
        const other = params.find(p => p !== 'wind_barb');
        const wv = extractVal(obs, 'wind_barb');
        const ov = extractVal(obs, other);
        const oc = paramColor(other, ov);
        const oTxt = fmtVal(other, ov);
        const svg = windBarbSVG(wv.spd, wv.dir, barbColor());
        const box = mkBox(oTxt, oc.bg, oc.fg);
        const bw = estW(oTxt);
        const icon = L.divIcon({
          html: `<div style="opacity:${opacity.toFixed(2)};display:flex;align-items:center;gap:2px;">${svg}${box}</div>`,
          className: '', iconSize: [50 + bw, 50], iconAnchor: [25, 25]
        });
        return buildMarker(pos, icon, obs);

      } else if (params.length === 1) {
        const val = extractVal(obs, params[0]);
        // WW: render WMO symbol instead of text
        if (params[0] === 'ww' && val) {
          const mc = wxMarkerContent(val, opacity);
          const icon = L.divIcon({
            html: mc.html, className: '',
            iconSize: [mc.w, mc.h], iconAnchor: [Math.round(mc.w / 2), Math.round(mc.h / 2)]
          });
          return buildMarker(pos, icon, obs);
        }
        const c = paramColor(params[0], val);
        const txt = fmtVal(params[0], val);
        const w = estW(txt), h = 22;
        const icon = mkDivIcon(mkBox(txt, c.bg, c.fg), w, h, opacity);
        return buildMarker(pos, icon, obs);

      } else { // 2 params
        const v1 = extractVal(obs, params[0]), v2 = extractVal(obs, params[1]);
        // If one param is ww, render symbol + text side-by-side
        const wwIdx = params.indexOf('ww');
        if (wwIdx >= 0) {
          const wxVal = wwIdx === 0 ? v1 : v2;
          const othPid = wwIdx === 0 ? params[1] : params[0];
          const othVal = wwIdx === 0 ? v2 : v1;
          const mc = wxMarkerContent(wxVal || '—', opacity);
          const oc = paramColor(othPid, othVal);
          const otxt = fmtVal(othPid, othVal);
          const bw = estW(otxt);
          const html = `<div style="display:flex;align-items:center;gap:3px;opacity:${opacity.toFixed(2)};">
        ${mc.html}
        ${mkBox(otxt, oc.bg, oc.fg)}
      </div>`;
          const icon = L.divIcon({
            html, className: '',
            iconSize: [mc.w + bw + 6, 26], iconAnchor: [Math.round((mc.w + bw + 6) / 2), 13]
          });
          return buildMarker(pos, icon, obs);
        }
        const c1 = paramColor(params[0], v1), c2 = paramColor(params[1], v2);
        const t1 = fmtVal(params[0], v1), t2 = fmtVal(params[1], v2);
        const w = estW(t1) + estW(t2), h = 22;
        const html = `<div style="display:flex;border-radius:4px;overflow:hidden;
      border:1px solid rgba(255,255,255,.22);box-shadow:0 2px 6px rgba(0,0,0,.55);cursor:pointer;">
      <div style="background:${c1.bg};color:${c1.fg};padding:2px 6px;
        font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;white-space:nowrap;">${t1}</div>
      <div style="background:${c2.bg};color:${c2.fg};padding:2px 6px;
        font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
        white-space:nowrap;border-left:1px solid rgba(255,255,255,.18);">${t2}</div>
    </div>`;
        const icon = mkDivIcon(html, w, h, opacity);
        return buildMarker(pos, icon, obs);
      }
    }

    function buildMarker(pos, icon, obs) {
      const m = L.marker(pos, { icon });
      m.bindTooltip(tooltipHTML(obs), { className: 'metar-tt', direction: 'top', offset: [0, -4] });
      m.bindPopup(popupHTML(obs), { maxWidth: 420 });
      return m;
    }

    function tooltipHTML(obs) {
      const elev = obs.elev != null ? `${Math.round(obs.elev)} m ü.NN` : '';
      const srcClr = obs.metarType === 'SYNOP-BUFR' ? '#00e090'
        : obs.metarType === 'SYNOP' ? '#ffb000'
          : '#00d4ff';
      const srcLabel = obs.metarType || 'METAR';
      return `<div style="background:rgba(8,12,20,.9);border:1px solid #1d2d42;padding:6px 10px;
    border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;
    box-shadow:0 4px 16px rgba(0,0,0,.7);">
    <span style="color:${srcClr};font-weight:700;font-size:14px;">${obs.icaoId}</span>
    <span style="color:${srcClr};font-size:9px;margin-left:6px;opacity:.7;">${srcLabel}</span>
    <br><span style="color:#7a9ab8;font-family:'Inter',sans-serif;font-size:11px;">${obs.name || ''}</span>
    ${elev ? `<br><span style="color:#4d6e8a;font-size:10px;">${elev}</span>` : ''}
  </div>`;
    }

    function popupHTML(obs) {
      const v = parseVis(obs.visib);
      const ceil = parseCeiling(obs.skyCondition);
      const cs = colorState(v, ceil);
      const qnh = parseQNH(obs.altim);
      const _td = obs.obsTime ? new Date(obs.obsTime * 1000) : null;
      const t = _td
        ? `${String(_td.getUTCDate()).padStart(2, '0')}. `
        + ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'][_td.getUTCMonth()]
        + ` ${_td.getUTCFullYear()}  ${String(_td.getUTCHours()).padStart(2, '0')}:${String(_td.getUTCMinutes()).padStart(2, '0')} UTC`
        : '—';
      const elev = obs.elev != null ? `${Math.round(obs.elev)} m` : '—';

      const skyHTML = normSky(obs).map(s =>
        `<span class="sky-chip">${s.skyCover}${s.cloudBase != null ? ' ' + String(Math.round(s.cloudBase / 100)).padStart(3, '0') + 'hft' : ''}</span>`
      ).join('');

      const rows = [
        ['Sicht', fmtVis(v)],
        ['Ceiling', ceil != null ? `${Math.round(ceil / 100)} hft (${ceil} ft)` : 'CAVOK/kein'],
        ['Temperatur', obs.temp != null ? `${obs.temp} °C` : '—'],
        ['Taupunkt', obs.dewp != null ? `${obs.dewp} °C` : '—'],
        ['Wind', fmtWind(obs)],
        ['QNH', qnh ? `${qnh} hPa` : '—'],
        ['WW', obs.wxString || 'keine'],
        ['Typ', obs.metarType || 'METAR'],
      ].map(([k, v]) => `<div class="pop-row"><span class="pop-key">${k}</span><span class="pop-val">${v}</span></div>`).join('');

      return `<div>
    <div class="pop-head">
      <div>
        <span class="pop-icao">${obs.icaoId}</span>
        <span class="pop-badge" style="background:${cs.bg};color:${cs.fg};">${cs.abbr}</span>
      </div>
      <div class="pop-name">${obs.name || ''}</div>
      <div class="pop-meta">Höhe: ${elev} &nbsp;·&nbsp; ${t}</div>
    </div>
    <div class="pop-grid">${rows}</div>
    ${skyHTML ? `<div class="pop-sky"><div class="pop-sky-title">BEWÖLKUNG</div>${skyHTML}</div>` : ''}
    <div class="pop-raw">${obs.rawOb || 'Rohmeldung nicht verfügbar'}</div>
  </div>`;
    }

    function fmtWind(obs) {
      if (obs.wspd == null && !obs.wdir) return '—';
      const dir = obs.wdir === 'VRB' ? 'VRB' : (obs.wdir ? obs.wdir + '°' : '---');
      const gust = obs.wgst ? ` G${obs.wgst}` : '';
      return `${dir} ${obs.wspd ?? '—'}kt${gust}`;
    }

    // ═══════════════════════════════════════════════════════════════
    // DATA FETCH & CACHE
    // ═══════════════════════════════════════════════════════════════

    async function fetchMETARs(bounds, hours) {
      const w = bounds.getWest().toFixed(1);
      const s = bounds.getSouth().toFixed(1);
      const e = bounds.getEast().toFixed(1);
      const n = bounds.getNorth().toFixed(1);
      const h = hours; // pass directly – API accepts decimal values
      const key = `${w},${s},${e},${n}|h${h}`;
      const now = Date.now();

      if (dataCache.has(key)) {
        const { data, ts } = dataCache.get(key);
        if (now - ts < CACHE_TTL) return data;
      }

      setStatus('loading');
      const url = `https://aviationweather.gov/api/data/metar?format=json&hours=${h}&bbox=${s},${w},${n},${e}`;
      console.log('Karte bbox (Leaflet):', { west: w, south: s, east: e, north: n });

      const resp = await corsGet(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      if (!Array.isArray(data)) throw new Error('Unerwartetes Format');

      dataCache.set(key, { data, ts: now });
      console.log(`API URL: ${url}`);
      console.log(`API bbox gesendet: W=${w} S=${s} E=${e} N=${n}`);
      if (data.length > 0) {
        const ex = data[0];
        console.log('Feldformat:', { icaoId: ex.icaoId, obsTime: ex.obsTime, lat: ex.lat, lon: ex.lon, temp: ex.temp });
      }
      console.log('Alle empfangenen Stationen:',
        data.map(o => `${o.icaoId} (lat=${o.lat?.toFixed(1)} lon=${o.lon?.toFixed(1)})`).join(' | '));
      return data;
    }

    function obsAtTime(allObsList, targetMs) {
      const best = new Map();
      let skippedFuture = 0, skippedOld = 0;
      for (const obs of allObsList) {
        // obsTime can be Unix seconds (number) or ISO string
        let t;
        if (typeof obs.obsTime === 'number') t = obs.obsTime * 1000;
        else if (typeof obs.obsTime === 'string') t = new Date(obs.obsTime.replace(' ', 'T') + 'Z').getTime();
        else t = targetMs; // fallback: treat as current

        if (isNaN(t)) { t = targetMs; }

        const windowMs = Math.max(3 * 60 * 60 * 1000, Math.abs(targetMs - Date.now()) + 2 * 60 * 60 * 1000);
        if (t > targetMs + 90 * 60 * 1000) { skippedFuture++; continue; }
        if (t < targetMs - windowMs) { skippedOld++; continue; }

        const id = obs.icaoId;
        if (!best.has(id) || t > best.get(id)._t) {
          best.set(id, { ...obs, _t: t });
        }
      }
      if (skippedFuture || skippedOld)
        console.log(`obsAtTime: ${skippedFuture} zu neu, ${skippedOld} zu alt gefiltert`);

      // Attach age in minutes for transparency rendering
      const result = Array.from(best.values());
      result.forEach(o => { o._ageMin = Math.max(0, (targetMs - o._t) / 60000); });
      return result;
    }

    // ═══════════════════════════════════════════════════════════════
    // MAP & RENDERING
    // ═══════════════════════════════════════════════════════════════

    const map = L.map('map', { center: [51.5, 10.0], zoom: 6, zoomControl: false });
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.control.scale({ metric: true, imperial: false, position: 'bottomright' }).addTo(map);

    const tiles = {
      dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        { attribution: '© OpenStreetMap, © CARTO', subdomains: 'abcd', maxZoom: 19 }),
      light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
        { attribution: '© OpenStreetMap, © CARTO', subdomains: 'abcd', maxZoom: 19 }),
      topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
        { attribution: '© OpenStreetMap, © OpenTopoMap', subdomains: 'abc', maxZoom: 17 }),
      sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { attribution: '© Esri', maxZoom: 19 })
    };
    let activeTile = 'dark';

    function barbColor() {
      // Dark tiles → white barbs; light/topo/sat tiles → dark barbs with outline
      return ['light', 'topo'].includes(activeTile) ? '#1a1a2e' : '#ffffff';
    }
    tiles.dark.addTo(map);

    function switchTile(name) {
      if (name === activeTile) return;
      map.removeLayer(tiles[activeTile]);
      tiles[name].addTo(map);
      activeTile = name;
      document.querySelectorAll('.tile-btn').forEach(b => b.classList.toggle('active', b.dataset.tile === name));
      // Re-render markers so barb color updates
      if (allObs.length) rerenderFromCache();
    }

    // ═══════════════════════════════════════════════════════════════
    // METEOROLOGICAL GRID THINNING
    // ═══════════════════════════════════════════════════════════════

    // Grid cell size in degrees as function of zoom level.
    // At zoom 10+ every station is shown; below that cells grow exponentially.
    function gridCellDeg(zoom) {
      if (zoom >= 10) return 0;          // no thinning
      // ~300 km at zoom 4, halves every level
      return 5.0 / Math.pow(2, zoom - 4);
    }

    // Returns a score for how meteorologically "interesting" a station is
    // for the given parameter. Higher = keep this station over neighbours.
    function meteoScore(obs, pid) {
      switch (pid) {
        case 'visibility': {
          const v = parseVis(obs.visib);
          return v != null ? 100000 / (v + 1) : 0;   // lower vis → higher score
        }
        case 'ceiling': {
          const c = parseCeiling(obs.skyCondition);
          return c != null ? 100000 / (c + 1) : 0;
        }
        case 'colorstate': {
          // Worst color state = highest index in CS array (RED at end)
          const v = parseVis(obs.visib);
          const c = parseCeiling(obs.skyCondition);
          const st = colorState(v, c);
          return CS.indexOf(st);   // 0=BLU+ … 6=RED
        }
        case 'wind_barb':
        case 'wind_speed':
          return obs.wspd ?? 0;
        case 'wind_gust':
          return obs.wgst ?? obs.wspd ?? 0;
        case 'wind_dir':
          return obs.wspd ?? 0;   // prefer windier stations
        case 'pressure': {
          const q = parseQNH(obs.altim);
          return q ? Math.abs(q - 1013) : 0;
        }
        case 'pres_tend':
          return Math.abs(obs.presTend ?? 0);
        case 'ww':
          return obs.wxString ? 100 : 0;
        case 'temperature':
          return obs.temp != null ? Math.abs(obs.temp) : 0;
        case 'dewpoint':
          return obs.dewp != null ? Math.abs(obs.dewp) : 0;
        case 'clouds_lo': {
          const l = getCloudLayer(obs.skyCondition, 0, 6500);
          return l ? 10000 / (l.cloudBase + 1) : 0;
        }
        case 'clouds_mi': {
          const l = getCloudLayer(obs.skyCondition, 6500, 20000);
          return l ? 10000 / (l.cloudBase + 1) : 0;
        }
        case 'clouds_hi': {
          const l = getCloudLayer(obs.skyCondition, 20000, 99999);
          return l ? 10000 / (l.cloudBase + 1) : 0;
        }
        default: return 0;
      }
    }

    // Combined score for 1 or 2 active parameters
    function combinedScore(obs, params) {
      if (params.length === 0) return 0;
      if (params.length === 1) return meteoScore(obs, params[0]);
      // Two params: take the maximum — the "more dangerous" dimension wins
      return Math.max(meteoScore(obs, params[0]), meteoScore(obs, params[1]));
    }

    // Main thinning function: returns a meteorologically-aware subset
    function thinStations(obs, zoom, params) {
      const cell = gridCellDeg(zoom);
      if (cell === 0) return obs;   // zoom >= 10: show everything

      const grid = new Map();
      for (const o of obs) {
        if (o.lat == null || o.lon == null) continue;
        const ix = Math.floor(o.lon / cell);
        const iy = Math.floor(o.lat / cell);
        const key = `${ix},${iy}`;
        const score = combinedScore(o, params);
        if (!grid.has(key) || score > grid.get(key).score) {
          grid.set(key, { obs: o, score });
        }
      }
      const result = Array.from(grid.values()).map(v => v.obs);
      console.log(`thinStations zoom=${zoom} cell=${cell.toFixed(2)}° → ${obs.length} → ${result.length}`);
      return result;
    }

    function renderObs(obs) {
      if (markerLayer) { map.removeLayer(markerLayer); markerLayer = null; }
      markerLayer = L.layerGroup();
      const zoom = map.getZoom();
      const thinned = thinStations(obs, zoom, selectedParams);
      const subset = thinned.slice(0, MAX_MARKERS);
      let ok = 0, fail = 0;
      for (const o of subset) {
        if (o.lat == null || o.lon == null) continue;
        try { markerLayer.addLayer(createMarker(o, selectedParams)); ok++; }
        catch (e) { fail++; if (fail <= 3) console.warn(`Marker [${o.icaoId}]:`, e.message); }
      }
      markerLayer.addTo(map);
      const info = `${ok} Stat.${fail > 0 ? ' (' + fail + ' Err)' : ''}`;
      document.getElementById('station-count').textContent = info;
      console.log(`renderObs: gesamt=${obs.length} subset=${subset.length} ok=${ok} fail=${fail}`);
      if (subset.length > 0)
        console.log('Beispiel-Rohformat (1. Datensatz):', JSON.stringify(subset[0]));
    }

    const debouncedUpdate = debounce(updateDisplay, 700);

    async function updateDisplay() {
      if (isLoading) return;
      isLoading = true;
      showLoading(`Lade ${[...activeSources].map(s => s.toUpperCase()).join(' + ')} …`);

      try {
        const zoom = map.getZoom();
        if (zoom < 4) {
          renderObs([]);
          setStatus('ok'); setStatusTxt('Zoom ≥ 4 für Stationsdaten');
          return;
        }

        const hoursNeeded = Math.min(Math.max(1.5, Math.abs(timeOffset) + 1.5), 48);
        const targetMs    = Date.now() + timeOffset * 3600000;
        const bounds      = map.getBounds();

        // ── Phase 1: METAR + OGIMET (schnell) ──────────────────────
        let metarObs = [];
        if (activeSources.has('metar')) {
          allObs   = await fetchMETARs(bounds, hoursNeeded);
          metarObs = obsAtTime(allObs, targetMs);
        }

        let ogimetObs = [];
        if (activeSources.has('synop')) {
          ogimetObs = await fetchOgimetObs(bounds, hoursNeeded);
          synopObs  = ogimetObs;
        }

        // Sofort rendern – Karte ist damit innerhalb von ~2 s befüllt
        const phase1 = dedupMetarSynop([...metarObs, ...obsAtTime(ogimetObs, targetMs)]);
        renderObs(phase1);
        const ts1 = new Date().toLocaleTimeString('de-DE');
        setStatus('ok');
        if (activeSources.has('synop')) {
          setStatusTxt(`${phase1.length} Stat. · BUFR lädt …`);
        } else {
          setStatusTxt(`${phase1.length} Stat. · ${ts1}`);
        }
        hideLoading();
        isLoading = false;  // Karte ist wieder bedienbar

        // ── Phase 2: DWD BUFR im Hintergrund (langsam) ─────────────
        if (activeSources.has('synop')) {
          try {
            const bufrObs = await fetchBufrObs(bounds, hoursNeeded);
            if (bufrObs.length > 0) {
              const merged = mergeOgimetBufr(ogimetObs, bufrObs);
              synopObs     = merged;
              const phase2 = dedupMetarSynop([...metarObs, ...obsAtTime(merged, targetMs)]);
              renderObs(phase2);
              const ts2 = new Date().toLocaleTimeString('de-DE');
              setStatus('ok');
              setStatusTxt(`${phase2.length} Stat. (OGIMET+BUFR) · ${ts2}`);
            } else {
              const ts2 = new Date().toLocaleTimeString('de-DE');
              setStatusTxt(`${phase1.length} Stat. (OGIMET) · ${ts2}`);
            }
          } catch (e2) {
            console.warn('BUFR Hintergrundfehler:', e2);
          }
        }

      } catch (err) {
        setStatus('error'); setStatusTxt('Ladefehler – ↺ erneut versuchen');
        console.error(err);
      } finally {
        if (isLoading) { isLoading = false; hideLoading(); }
      }
    }

    map.on('moveend', debouncedUpdate);
    map.on('zoomend', debouncedUpdate);

    function debounce(fn, delay) {
      let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), delay); };
    }

    // ═══════════════════════════════════════════════════════════════
    // STATUS
    // ═══════════════════════════════════════════════════════════════

    function setStatus(s) {
      document.getElementById('status-dot').className = s;
    }
    function setStatusTxt(txt) {
      document.getElementById('status-text').textContent = txt;
    }

    let _loadingTimer = null;
    function showLoading(msg = 'Lade Wetterdaten …', sub = '') {
      const ov = document.getElementById('loading-overlay');
      const msg_ = document.getElementById('loading-msg');
      const sub_ = document.getElementById('loading-sub');
      msg_.textContent = msg;
      sub_.textContent = sub;
      // Small delay so fast loads don't flicker
      clearTimeout(_loadingTimer);
      _loadingTimer = setTimeout(() => ov.classList.add('visible'), 180);
    }
    function hideLoading() {
      clearTimeout(_loadingTimer);
      document.getElementById('loading-overlay').classList.remove('visible');

    // ═══════════════════════════════════════════════════════════════
    // PARAM UI
    // ═══════════════════════════════════════════════════════════════

    function buildParamUI() {
      const scroll = document.getElementById('param-scroll');
      scroll.innerHTML = '';
      PARAM_GROUPS.forEach(grp => {
        const params = PARAMS.filter(p => p.group === grp);
        const div = document.createElement('div');
        div.className = 'param-group';
        div.innerHTML = `<div class="param-group-title">${grp}</div>`;
        params.forEach(p => {
          const item = document.createElement('div');
          item.className = 'param-item';
          item.dataset.id = p.id;
          item.innerHTML = `
        <div class="sel-dot"></div>
        <span class="param-name">${p.label}</span>
        <span class="param-slot" id="slot-${p.id}">—</span>`;
          item.addEventListener('click', () => toggleParam(p.id));
          div.appendChild(item);
        });
        scroll.appendChild(div);
      });
      refreshParamUI();
    }

    function toggleParam(id) {
      if (selectedParams.includes(id)) {
        if (selectedParams.length > 1) selectedParams = selectedParams.filter(p => p !== id);
      } else {
        selectedParams = selectedParams.length >= 2
          ? [selectedParams[1], id]
          : [...selectedParams, id];
      }
      refreshParamUI();
      updateLegend();
      rerenderFromCache();
    }

    function refreshParamUI() {
      document.querySelectorAll('.param-item').forEach(el => {
        const id = el.dataset.id;
        const idx = selectedParams.indexOf(id);
        el.classList.remove('sel-1', 'sel-2');
        if (idx === 0) el.classList.add('sel-1');
        else if (idx === 1) el.classList.add('sel-2');
        const slot = el.querySelector('.param-slot');
        if (idx === 0) slot.textContent = '①';
        else if (idx === 1) slot.textContent = '②';
        else slot.textContent = '';
      });
    }

    function rerenderFromCache() {
      if (!allObs.length) return;
      const targetMs = Date.now() + timeOffset * 3600000;
      renderObs(obsAtTime(allObs, targetMs));
    }

    // ═══════════════════════════════════════════════════════════════
    // LEGEND
    // ═══════════════════════════════════════════════════════════════

    function updateLegend() {
      const c = document.getElementById('legend-container');
      c.innerHTML = '';
      selectedParams.forEach((pid, i) => {
        const p = PARAMS.find(x => x.id === pid);
        if (!p) return;
        const clr = i === 0 ? 'var(--cyan)' : 'var(--amber)';
        const wrap = document.createElement('div');
        wrap.className = 'legend-block';

        const lbl = document.createElement('div');
        lbl.className = 'legend-label';
        lbl.style.color = clr;
        lbl.textContent = `${i === 0 ? '①' : '②'} ${p.label}`;
        wrap.appendChild(lbl);

        const body = legendBody(pid);
        if (body) wrap.appendChild(body);
        c.appendChild(wrap);
      });
    }

    function legendBody(pid) {
      const csLegend = () => {
        const d = document.createElement('div');
        d.className = 'legend-badges';
        CS.forEach(s => {
          const b = document.createElement('span');
          b.className = 'cs-badge';
          b.style.background = s.bg; b.style.color = s.fg;
          b.textContent = s.abbr;
          d.appendChild(b);
        });
        return d;
      };
      const gradLegend = (stops, lo, hi) => {
        const d = document.createElement('div');
        const grad = stops.map(s => `rgb(${s.r},${s.g},${s.b})`).join(',');
        d.innerHTML = `<div class="legend-gradient" style="background:linear-gradient(to right,${grad})"></div>
      <div class="legend-range"><span>${lo}</span><span>${hi}</span></div>`;
        return d;
      };

      switch (pid) {
        case 'colorstate': case 'visibility': case 'ceiling': return csLegend();
        case 'temperature': case 'dewpoint': return gradLegend(TEMP_S, '-30°C', '40°C');
        case 'wind_speed': case 'wind_gust': return gradLegend(WIND_S, '0kt', '65kt');
        case 'wind_barb': return null; // Barb count encodes speed — no color scale needed
        case 'pressure': return gradLegend(PRES_S, '975hPa', '1040hPa');
        case 'pres_tend': return gradLegend(TEND_S, '-6hPa', '+6hPa');
        case 'clouds_lo': case 'clouds_mi': case 'clouds_hi': {
          const d = document.createElement('div');
          d.className = 'legend-badges';
          // FEW/SCT → neutral
          ['FEW','SCT'].forEach(n => {
            const b = document.createElement('span');
            b.className = 'cs-badge'; b.style.background = '#78909C'; b.style.color = '#ffffff';
            b.textContent = n; d.appendChild(b);
          });
          // separator
          const sep = document.createElement('span');
          sep.style.cssText = 'color:#aaa;font-size:10px;align-self:center;margin:0 2px;';
          sep.textContent = '|  BKN/OVC ='; d.appendChild(sep);
          // BKN/OVC → full CS scale
          CS.forEach(s => {
            const b = document.createElement('span');
            b.className = 'cs-badge'; b.style.background = s.bg; b.style.color = s.fg;
            b.textContent = s.abbr; d.appendChild(b);
          });
          return d;
        }
        case 'wind_dir': {
          const d = document.createElement('div');
          d.className = 'legend-badges';
          d.innerHTML = `<span class="cs-badge" style="background:#0d2840;color:#4ab8f0;">N/O/S/W in °</span>`;
          return d;
        }
        case 'ww': {
          const d = document.createElement('div');
          d.className = 'legend-badges';
          [['TS', '#4a0080', '#e0a0ff'], ['SN', '#a0c4e0', '#001040'], ['RA', '#0a3a7a', '#80c8ff'],
          ['FG', '#30301a', '#cccc80'], ['HZ', '#4a4020', '#ddcc80']].forEach(([n, bg, fg]) => {
            const b = document.createElement('span');
            b.className = 'cs-badge'; b.style.background = bg; b.style.color = fg;
            b.textContent = n; d.appendChild(b);
          });
          return d;
        }
      }
      return null;
    }

    // ═══════════════════════════════════════════════════════════════
    // TIME CONTROL
    // ═══════════════════════════════════════════════════════════════

    function setupTime() {
      const slider = document.getElementById('time-slider');
      const disp = document.getElementById('time-display');

      function updateDisp() {
        const steps = parseInt(slider.value);
        timeOffset = steps * 0.25; // 15min per step
        if (timeOffset >= -0.05) {
          const now = new Date();
          const hh = String(now.getUTCHours()).padStart(2, '0');
          const mm = String(now.getUTCMinutes()).padStart(2, '0');
          disp.textContent = `▶ AKTUELL · ${hh}:${mm} UTC`;
          disp.style.color = 'var(--green)';
        } else {
          const absH = Math.abs(timeOffset);
          const hh = Math.floor(absH);
          const mm = Math.round((absH - hh) * 60);
          const target = new Date(Date.now() + timeOffset * 3600000);
          const ts = `${String(target.getUTCHours()).padStart(2, '0')}:${String(target.getUTCMinutes()).padStart(2, '0')} UTC`;
          disp.textContent = `◀ −${hh}h${mm > 0 ? String(mm).padStart(2, '0') + 'm' : ''} (${ts})`;
          disp.style.color = 'var(--amber)';
        }
      }

      slider.addEventListener('input', () => {
        updateDisp();
        rerenderFromCache();
        onTimeChange();
      });
      slider.addEventListener('change', () => { debouncedUpdate(); onTimeChange(); });
      updateDisp();

      document.getElementById('btn-now').addEventListener('click', () => {
        slider.value = 0; updateDisp();
        dataCache.clear(); updateDisplay();
      });

      // Keep the clock ticking when showing current data
      setInterval(() => { if (timeOffset >= -0.05) updateDisp(); }, 30000);

      document.getElementById('refresh-btn').addEventListener('click', () => {
        dataCache.clear(); updateDisplay();
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // RAINVIEWER OVERLAY
    // ═══════════════════════════════════════════════════════════════

    const RV_API = 'https://api.rainviewer.com/public/weather-maps.json';
    let rvMeta = null;       // cached API response
    let rvMetaTs = 0;
    const RV_META_TTL = 5 * 60 * 1000;  // refresh metadata every 5 min

    let radarLayer = null;
    let labelsLayer = null;  // political overlay for satellite mode
    const LABELS_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';

    function showLabelsOverlay() {
      if (labelsLayer) return;
      labelsLayer = L.tileLayer(LABELS_URL, {
        attribution: '© Esri, © OpenStreetMap',
        maxZoom: 19,
        zIndex: 10,   // above everything
        pane: 'overlayPane',
      });
      labelsLayer.addTo(map);
    }
    function hideLabelsOverlay() {
      if (labelsLayer) { map.removeLayer(labelsLayer); labelsLayer = null; }
    }
    let satLayer = null;
    let radarOn = false;
    let satOn = false;
    let ovOpacity = 0.70;
    const ovColor = 4;   // RainViewer free: color fixed (API key needed for choice)

    // Fetch + cache RainViewer metadata JSON
    async function getRVMeta() {
      if (rvMeta && Date.now() - rvMetaTs < RV_META_TTL) return rvMeta;
      const resp = await corsGet(RV_API);
      rvMeta = await resp.json();
      rvMetaTs = Date.now();
      return rvMeta;
    }

    // Find frame closest in time to targetMs
    function rvClosest(frames, targetSec) {
      if (!frames || frames.length === 0) return null;
      return frames.reduce((best, f) =>
        Math.abs(f.time - targetSec) < Math.abs(best.time - targetSec) ? f : best
      );
    }

    function rvFmtTime(unixSec) {
      const d = new Date(unixSec * 1000);
      const hh = String(d.getUTCHours()).padStart(2, '0');
      const mm = String(d.getUTCMinutes()).padStart(2, '0');
      const dd = String(d.getUTCDate()).padStart(2, '0');
      const mo = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'][d.getUTCMonth()];
      return `${dd}. ${mo}  ${hh}:${mm} UTC`;
    }

    async function updateOverlays() {
      if (!radarOn && !satOn) return;
      let meta = null;
      if (radarOn) {
        try { meta = await getRVMeta(); }
        catch (e) { console.warn('RainViewer metadata fetch failed:', e.message); }
      }

      const targetSec = Math.round((Date.now() + timeOffset * 3600000) / 1000);
      const timeInfo = document.getElementById('ov-time-info');

      // ── RADAR ──────────────────────────────────────────────────
      if (radarOn && meta) {
        const allFrames = [...(meta.radar.past || []), ...(meta.radar.nowcast || [])];
        const frame = rvClosest(allFrames, targetSec);
        const tileUrl = `${meta.host}${frame.path}/256/{z}/{x}/{y}/${ovColor}/1_1.png`;

        // Always recreate radar layer so maxNativeZoom is always applied
        if (radarLayer) map.removeLayer(radarLayer);
        radarLayer = L.tileLayer(tileUrl, {
          opacity: ovOpacity,
          attribution: 'Radar: <a href="https://rainviewer.com" target="_blank">RainViewer</a>',
          zIndex: 5,
          tileSize: 256,
          maxNativeZoom: 7,   // RainViewer native max; Leaflet scales tiles above z7
          maxZoom: 19,
          transparent: true,
        });
        radarLayer.addTo(map);

        // Nowcast indicator
        const isNow = (meta.radar.nowcast || []).some(f => f.time === frame.time);
        timeInfo.innerHTML = `◉ Radar ${rvFmtTime(frame.time)}${isNow ? ' <span style="color:var(--amber)">▶ Nowcast</span>' : ''}`;
      }

      // ── SATELLITE (DWD WMS) ────────────────────────────────────
      if (satOn) {
        updateDWDSat();
        if (!radarOn) {
          const prod = document.getElementById('ov-satproduct');
          timeInfo.textContent = `◎ Satellit · ${prod.options[prod.selectedIndex].text} · DWD/EUMETSAT`;
        }
      }

      document.getElementById('overlay-controls').style.display = 'block';
    }

    // ── DWD WMS Satellite ─────────────────────────────────────────
    // /wms endpoint in server.py transparently proxies to maps.dwd.de/geoserver/dwd/wms
    // On a real web host, point directly at DWD (they allow CORS).
    function dwdWmsBase() {
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        return '/wms';
      return 'https://maps.dwd.de/geoserver/dwd/wms';
    }

    function updateDWDSat() {
      const product = document.getElementById('ov-satproduct').value;
      console.log('DWD SAT layer:', product);
      if (satLayer && satLayer._dwdProduct === product) {
        satLayer.setOpacity(ovOpacity);
        return;
      }
      if (satLayer) { map.removeLayer(satLayer); satLayer = null; }
      satLayer = L.tileLayer.wms(dwdWmsBase(), {
        layers: product,
        format: 'image/png',
        transparent: true,
        opacity: ovOpacity,
        version: '1.3.0',
        uppercase: false,
        attribution: 'Satellit: <a href="https://www.dwd.de" target="_blank">DWD</a> / EUMETSAT',
        zIndex: 4,
      });
      satLayer._dwdProduct = product;
      satLayer.addTo(map);
      console.log(`DWD WMS layer added: ${product} via ${dwdWmsBase()}`);
    }

    function removeRadar() {
      if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
    }
    function removeSat() {
      if (satLayer) { map.removeLayer(satLayer); satLayer = null; }
    }
    function refreshOverlayControls() {
      const any = radarOn || satOn;
      document.getElementById('overlay-controls').style.display = any ? 'block' : 'none';

      document.getElementById('ov-satproduct-row').style.display = satOn ? 'flex' : 'none';
      document.getElementById('ov-radar').classList.toggle('active', radarOn);
      document.getElementById('ov-sat').classList.toggle('active', satOn);
      if (!any) document.getElementById('ov-time-info').textContent = '';
    }

    function setupOverlays() {
      // Toggle buttons
      document.getElementById('ov-radar').addEventListener('click', async () => {
        radarOn = !radarOn;
        if (!radarOn) removeRadar();
        refreshOverlayControls();
        await updateOverlays();
      });
      document.getElementById('ov-sat').addEventListener('click', async () => {
        satOn = !satOn;
        if (!satOn) { removeSat(); hideLabelsOverlay(); }
        else showLabelsOverlay();
        refreshOverlayControls();
        await updateOverlays();
      });

      // Opacity
      const opSlider = document.getElementById('ov-opacity');
      const opVal = document.getElementById('ov-opacity-val');
      opSlider.addEventListener('input', () => {
        ovOpacity = parseInt(opSlider.value) / 100;
        opVal.textContent = `${opSlider.value}%`;
        if (radarLayer) radarLayer.setOpacity(ovOpacity);
        if (satLayer) satLayer.setOpacity(ovOpacity);
      });

      // Satellite product (DWD WMS)
      document.getElementById('ov-satproduct').addEventListener('change', () => {
        if (satLayer) { map.removeLayer(satLayer); satLayer = null; }
        if (satOn) {
          updateDWDSat();
          const prod = document.getElementById('ov-satproduct');
          document.getElementById('ov-time-info').textContent =
            `◎ Satellit · ${prod.options[prod.selectedIndex].text} · DWD/EUMETSAT`;
        }
      });
    }

    // Hook into existing time slider so overlays follow time navigation
    const _origSliderHandler = debouncedUpdate;  // wrap after debouncedUpdate exists
    function onTimeChange() {
      if (radarOn || satOn) updateOverlays();
    }

    buildParamUI();
    updateLegend();
    setupTime();
    setupOverlays();
    setupSourceToggles();

    // Auto-refresh every 5 min when showing current data
    setInterval(() => {
      if (timeOffset >= -0.05) { dataCache.clear(); updateDisplay(); }
    }, AUTO_REFRESH);

    // Initial load
    updateDisplay();

    // ── Monitor Tab ───────────────────────────────────────────────────────────
    const Mon = (() => {
      const MAX_WX = 10, MAX_TAF = 4;
      const LS_WX = 'monWxStations', LS_TAF = 'monTafStations';

      function load(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; } }
      function save(key, arr) { localStorage.setItem(key, JSON.stringify(arr)); }

      async function fetchMetar(id) {
        const url = `https://aviationweather.gov/api/data/metar?ids=${encodeURIComponent(id)}&format=json&hours=3`;
        const r = await corsGet(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const arr = await r.json();
        return arr?.length ? arr[0] : null;
      }

      async function fetchTaf(id) {
        // Primary: AWC JSON API
        const awcUrl = `https://aviationweather.gov/api/data/taf?ids=${encodeURIComponent(id)}&format=json`;
        const r = await corsGet(awcUrl);
        if (r.ok) {
          const text = await r.text();
          if (text?.trim()) {
            const arr = JSON.parse(text);
            if (arr?.length) return { rawTAF: arr[0].rawTAF || arr[0].rawTaf || arr[0].rawOb, _src: 'AWC' };
          }
        }
        // Fallback: NOAA tgftp plaintext (broader station coverage incl. military)
        const tgUrl = `https://tgftp.nws.noaa.gov/data/forecasts/taf/stations/${encodeURIComponent(id.toUpperCase())}.TXT`;
        const tr = await corsGet(tgUrl);
        if (!tr.ok) throw new Error(`Keine TAF (AWC+NOAA, HTTP ${tr.status})`);
        const raw = await tr.text();
        if (!raw?.trim()) return null;
        // Format: first line = "YYYY/MM/DD HH:MM", then TAF text
        const lines = raw.trim().split('\n');
        const dateLine = lines[0].trim();
        const tafText = lines.slice(1).join('\n').trim();
        // Warn if older than 30 h
        let ageWarn = '';
        const m = dateLine.match(/(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/);
        if (m) {
          const issued = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]));
          const ageH = (Date.now() - issued.getTime()) / 3600000;
          if (ageH > 30) ageWarn = `⚠ Daten vom ${dateLine} UTC (${Math.round(ageH)}h alt)\n`;
        }
        return { rawTAF: ageWarn + tafText, _src: 'NOAA-tgftp' };
      }

      function normalizeObs(raw) {
        return {
          icaoId: raw.icaoId || raw.stationId || '????',
          name: raw.name || '',
          obsTime: raw.obsTime,
          temp: raw.temp,
          dewp: raw.dewp,
          wdir: raw.wdir != null ? String(raw.wdir) : null,
          wspd: raw.wspd,
          wgst: raw.wgst,
          visib: raw.visib,
          altim: raw.altim,
          wxString: raw.wxString || (raw.presentWx?.join(' ')) || null,
          clouds: raw.clouds || [],
          skyCondition: null,
          metarType: raw.metarType || 'METAR',
          rawOb: raw.rawOb || raw.rawObservation || '',
        };
      }

      function parseSMFrac(str) {
        const parts = str.split('/');
        return parts.length === 2 ? parseInt(parts[0]) / parseInt(parts[1]) : parseFloat(str);
      }

      function colorizeWeatherText(text) {
        if (!text) return '';
        // Normalize compound SM fractions before tokenizing: "1 1/2SM" → "1.5SM"
        const normalized = text.replace(/\b(\d+)\s+(\d+)\/(\d+)SM\b/g,
          (_, w, n, d) => (parseInt(w) + parseInt(n) / parseInt(d)) + 'SM');
        return normalized.split(/(\s+)/).map(tok => {
          // Ceiling: BKN/OVC/VV + 3 digits (+ optional CB/TCU)
          const cm = tok.match(/^(BKN|OVC|VV)(\d{3})(CB|TCU)?$/);
          if (cm) {
            const cs = colorState(Infinity, parseInt(cm[2]) * 100);
            return `<span style="background:${cs.bg};color:${cs.fg};border-radius:3px;padding:0 3px;">${tok}</span>`;
          }
          // 4-digit vis in meters (ICAO: 0000–9999, optionally M-prefix)
          const vm = tok.match(/^M?(\d{4})$/);
          if (vm) {
            const v = parseInt(vm[1]);
            if (v <= 9999) {
              const cs = colorState(v, Infinity);
              return `<span style="background:${cs.bg};color:${cs.fg};border-radius:3px;padding:0 3px;">${tok}</span>`;
            }
          }
          // SM vis: "2SM", "1/4SM", "3/4SM", "1.5SM" (after compound normalization)
          const sm = tok.match(/^([\d\.\/]+)SM$/);
          if (sm) {
            const metres = Math.round(parseSMFrac(sm[1]) * 1609.344);
            const cs = colorState(metres, Infinity);
            return `<span style="background:${cs.bg};color:${cs.fg};border-radius:3px;padding:0 3px;">${tok}</span>`;
          }
          return tok;
        }).join('');
      }

      function monFormatParsed(obs) {
        const visMtr = parseVis(obs.visib);
        const sky = normSky(obs);
        const ceilFt = parseCeiling(sky);
        const cs = colorState(visMtr, ceilFt);
        const qnh = parseQNH(obs.altim);
        const td = obs.obsTime ? new Date(obs.obsTime * 1000) : null;
        const timeStr = td
          ? `${String(td.getUTCDate()).padStart(2, '0')}${String(td.getUTCHours()).padStart(2, '0')}${String(td.getUTCMinutes()).padStart(2, '0')}Z`
          : '——Z';

        // Wind token
        let wind = '—';
        if (obs.wspd != null || obs.wdir) {
          const dir = obs.wdir === 'VRB' ? 'VRB' : (obs.wdir ? String(obs.wdir).padStart(3, '0') : '///');
          const spd = obs.wspd != null ? String(Math.round(obs.wspd)).padStart(2, '0') : '//';
          const gst = obs.wgst ? `G${String(Math.round(obs.wgst)).padStart(2, '0')}` : '';
          wind = `${dir}${spd}${gst}KT`;
        }

        // Vis token
        const visStr = visMtr != null
          ? (visMtr >= 9999 ? '≥10' : visMtr >= 5000 ? `${Math.round(visMtr / 1000)}` : `${(visMtr / 1000).toFixed(1)}`)
          : '——';
        const csVis = visMtr != null ? colorState(visMtr, Infinity) : null;
        const visSpan = csVis
          ? `<span style="background:${csVis.bg};color:${csVis.fg};border-radius:3px;padding:0 3px;">${visStr}</span>`
          : visStr;

        // Sky tokens
        const CLOUD_NEUTRAL = { bg: '#78909C', fg: '#ffffff' };
        const skyStr = sky.length
          ? sky.map((s, idx) => {
            const h = s.cloudBase != null ? String(Math.round(s.cloudBase / 100)).padStart(3, '0') : '///';
            const token = `${s.skyCover}${h}`;
            const isCeiling = ['BKN', 'OVC', 'VV'].includes(s.skyCover);
            let col;
            if (!isCeiling) {
              col = CLOUD_NEUTRAL;
            } else {
              const lowerCeiling = sky.slice(0, idx).some(l => ['BKN', 'OVC', 'VV'].includes(l.skyCover) && l.cloudBase != null);
              col = (lowerCeiling || s.cloudBase == null) ? CLOUD_NEUTRAL : colorState(Infinity, s.cloudBase);
            }
            return `<span style="background:${col.bg};color:${col.fg};border-radius:3px;padding:0 3px;">${token}</span>`;
          }).join(' ')
          : 'SKC';

        const wxTok = obs.wxString ? `<span class="mon-tok">${obs.wxString}</span>` : '';
        const tdStr = obs.temp != null ? `${obs.temp}/${obs.dewp ?? '//'}` : '—';
        const qnhStr = qnh ? `Q${qnh}` : '—';
        const csChip = `<span class="cs-chip" style="background:${cs.bg};color:${cs.fg};">${cs.abbr}</span>`;

        return `<div class="mon-parsed">
          <span class="mon-tok mon-type">${obs.metarType}</span>
          <span class="mon-tok">${obs.icaoId}</span>
          <span class="mon-tok">${timeStr}</span>
          <span class="mon-tok">${wind}</span>
          <span class="mon-tok">${visSpan}</span>
          ${wxTok}
          <span class="mon-tok">${skyStr}</span>
          <span class="mon-tok">${tdStr}</span>
          <span class="mon-tok">${qnhStr}</span>
          ${csChip}
        </div>`;
      }

      function makeCard(id, idx, type) {
        const ph = type === 'wx' ? 'ICAO / WMO' : 'ICAO';
        return `<div class="mon-card" id="mon-card-${type}-${idx}">
          <div class="mon-card-hdr">
            <input class="mon-id-input" data-type="${type}" data-idx="${idx}" value="${id}" placeholder="${ph}">
            <span class="mon-type-badge" id="mon-badge-${type}-${idx}">—</span>
            <span class="mon-del" data-type="${type}" data-idx="${idx}" title="Entfernen">✕</span>
          </div>
          <div class="mon-body" id="mon-body-${type}-${idx}">
            <span style="color:var(--text-dim);font-size:10px;font-style:italic;">Lade…</span>
          </div>
        </div>`;
      }

      async function fetchSynopStation(wmoId) {
        const stations = await loadWmoStations();
        const block = Math.floor(wmoId / 1000);
        const now = new Date();
        const from = new Date(now - 3 * 3600000);
        const fmt = d => d.toISOString().replace(/[-T:]/g, '').slice(0, 12);

        // 1) Try Ogimet FM-12
        try {
          const url = `https://www.ogimet.com/cgi-bin/getsynop?block=${String(block).padStart(2,'0')}&begin=${fmt(from)}&end=${fmt(now)}`;
          const r = await corsGet(url);
          const text = await r.text();
          let obs = null;
          for (const line of text.split('\n')) {
            const l = line.trim().replace(/=+$/, '');
            if (!l || l.startsWith('#')) continue;
            if (parseInt(l.split(',')[0]) !== wmoId) continue;
            try { const o = parseSynopLine(l, stations); if (o) obs = o; } catch {}
          }
          if (obs) return obs;
        } catch {}

        // 2) Fallback: DWD BUFR (stations that don't report via FM-12)
        const st = stationById(wmoId);
        if (!st) return null;
        const pad = 0.5;
        const bbox = `${(st.lat - pad).toFixed(2)},${(st.lon - pad).toFixed(2)},${(st.lat + pad).toFixed(2)},${(st.lon + pad).toFixed(2)}`;
        const bufrObs = await fetch(`${SYNOP_API}/meteomap/bufr?bbox=${bbox}`)
          .then(r => r.ok ? r.json() : [])
          .catch(() => []);
        return bufrObs.find(o => o.wmoId === wmoId) || null;
      }

      async function renderWx(id, idx) {
        const body = document.getElementById(`mon-body-wx-${idx}`);
        const badge = document.getElementById(`mon-badge-wx-${idx}`);
        if (!body) return;
        body.innerHTML = `<span style="color:var(--text-dim);font-size:10px;font-style:italic;">Lade…</span>`;
        try {
          const isWmo = /^\d{4,5}$/.test(id.trim());
          let obs;
          if (isWmo) {
            obs = await fetchSynopStation(parseInt(id.trim()));
          } else {
            const raw = await fetchMetar(id.trim().toUpperCase());
            obs = raw ? normalizeObs(raw) : null;
          }
          if (!obs) { body.innerHTML = `<span style="color:#f44;font-size:10px;">Keine Daten für ${id}</span>`; return; }
          if (badge) badge.textContent = obs.metarType || (isWmo ? 'SYNOP' : 'METAR');
          const useRaw = document.getElementById('mon-raw')?.checked;
          body.innerHTML = useRaw
            ? `<div class="mon-raw-text">${colorizeWeatherText(obs.rawOb || '')}</div>`
            : monFormatParsed(obs);
        } catch (e) {
          body.innerHTML = `<span style="color:#f44;font-size:10px;">Fehler: ${e.message}</span>`;
        }
      }

      async function renderTaf(id, idx) {
        const body = document.getElementById(`mon-body-taf-${idx}`);
        const badge = document.getElementById(`mon-badge-taf-${idx}`);
        if (!body) return;
        body.innerHTML = `<span style="color:var(--text-dim);font-size:10px;font-style:italic;">Lade…</span>`;
        try {
          const raw = await fetchTaf(id.trim().toUpperCase());
          if (!raw) { body.innerHTML = `<span style="color:#f44;font-size:10px;">Keine TAF für ${id}</span>`; return; }
          if (badge) badge.textContent = raw._src === 'NOAA-tgftp' ? 'TAF·tgftp' : 'TAF';
          const rawTxt = raw.rawTAF || raw.rawTaf || raw.rawOb || '';
          // Render age-warning line (prefixed with ⚠) in amber, rest colorized
          const htmlLines = rawTxt.split('\n').map(line =>
            line.startsWith('⚠')
              ? `<span style="color:#E65100;font-size:10px;">${line}</span>`
              : colorizeWeatherText(line)
          ).join('\n');
          body.innerHTML = `<div class="mon-raw-text">${htmlLines}</div>`;
        } catch (e) {
          body.innerHTML = `<span style="color:#f44;font-size:10px;">Fehler: ${e.message}</span>`;
        }
      }

      function buildWxList() {
        const stations = load(LS_WX);
        const list = document.getElementById('mon-wx-list');
        if (!list) return;
        list.innerHTML = stations.map((id, i) => makeCard(id, i, 'wx')).join('');
        document.getElementById('mon-wx-add').disabled = stations.length >= MAX_WX;
        stations.forEach((id, i) => renderWx(id, i));
        list.querySelectorAll('.mon-del').forEach(btn => {
          btn.addEventListener('click', () => {
            const arr = load(LS_WX); arr.splice(+btn.dataset.idx, 1); save(LS_WX, arr); buildWxList();
          });
        });
        list.querySelectorAll('.mon-id-input').forEach(inp => {
          inp.addEventListener('change', () => {
            const arr = load(LS_WX); arr[+inp.dataset.idx] = inp.value.trim().toUpperCase();
            save(LS_WX, arr); renderWx(arr[+inp.dataset.idx], +inp.dataset.idx);
          });
        });
      }

      function buildTafList() {
        const stations = load(LS_TAF);
        const list = document.getElementById('mon-taf-list');
        if (!list) return;
        list.innerHTML = stations.map((id, i) => makeCard(id, i, 'taf')).join('');
        document.getElementById('mon-taf-add').disabled = stations.length >= MAX_TAF;
        stations.forEach((id, i) => renderTaf(id, i));
        list.querySelectorAll('.mon-del').forEach(btn => {
          btn.addEventListener('click', () => {
            const arr = load(LS_TAF); arr.splice(+btn.dataset.idx, 1); save(LS_TAF, arr); buildTafList();
          });
        });
        list.querySelectorAll('.mon-id-input').forEach(inp => {
          inp.addEventListener('change', () => {
            const arr = load(LS_TAF); arr[+inp.dataset.idx] = inp.value.trim().toUpperCase();
            save(LS_TAF, arr); renderTaf(arr[+inp.dataset.idx], +inp.dataset.idx);
          });
        });
      }

      function init() {
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${btn.dataset.tab}`)?.classList.add('active');
          });
        });

        document.getElementById('mon-wx-add')?.addEventListener('click', () => {
          const arr = load(LS_WX);
          if (arr.length >= MAX_WX) return;
          const id = prompt('ICAO-Kennung oder WMO-Kennziffer:');
          if (!id?.trim()) return;
          arr.push(id.trim().toUpperCase()); save(LS_WX, arr); buildWxList();
        });

        document.getElementById('mon-taf-add')?.addEventListener('click', () => {
          const arr = load(LS_TAF);
          if (arr.length >= MAX_TAF) return;
          const id = prompt('ICAO-Kennung:');
          if (!id?.trim()) return;
          arr.push(id.trim().toUpperCase()); save(LS_TAF, arr); buildTafList();
        });

        document.getElementById('mon-wx-refresh')?.addEventListener('click', () => {
          load(LS_WX).forEach((id, i) => renderWx(id, i));
        });
        document.getElementById('mon-taf-refresh')?.addEventListener('click', () => {
          load(LS_TAF).forEach((id, i) => renderTaf(id, i));
        });
        document.getElementById('mon-raw')?.addEventListener('change', () => {
          load(LS_WX).forEach((id, i) => renderWx(id, i));
        });

        buildWxList();
        buildTafList();

        // Auto-refresh every 5 min, only when Monitor tab is visible
        setInterval(() => {
          if (!document.getElementById('tab-monitor')?.classList.contains('active')) return;
          load(LS_WX).forEach((id, i) => renderWx(id, i));
          load(LS_TAF).forEach((id, i) => renderTaf(id, i));
        }, 5 * 60 * 1000);
      }

      return { init };
    })();

    Mon.init();
  </script>
</body>
