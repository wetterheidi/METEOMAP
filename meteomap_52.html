<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeteoMap — Wettermeldungsviewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #080c14;
      --panel: #0d1420;
      --panel2: #121b2c;
      --panel3: #182234;
      --border: #1d2d42;
      --border2: #253a54;
      --text: #bdd4e8;
      --text-dim: #4d6e8a;
      --text-mid: #7a9ab8;
      --cyan: #00d4ff;
      --amber: #ffb000;
      --green: #00e090;
      --red: #ff4444;
      --mono: 'JetBrains Mono', monospace;
      --head: 'Chakra Petch', sans-serif;
      --body: 'Inter', sans-serif;
      --sb-w: 272px;
      --cs-blue: #2196F3;
      --cs-white: #e8e8e8;
      --cs-green: #43A047;
      --cs-yellow: #FDD835;
      --cs-amber: #FB8C00;
      --cs-red: #E53935;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      font-size: 13px;
    }

    /* ── MAP ── */
    #map {
      position: absolute;
      inset: 0;
      left: var(--sb-w);
      z-index: 0;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--sb-w);
      background: var(--panel);
      border-right: 1px solid var(--border);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    #sb-head {
      padding: 14px 16px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── SOURCE TOGGLE ── */
    #source-row {
      display: flex;
      gap: 4px;
      padding: 6px 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .src-btn {
      flex: 1;
      padding: 5px 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: var(--head);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      border-radius: 5px;
      cursor: pointer;
      transition: all .15s;
      text-transform: uppercase;
    }

    .src-btn:hover:not(.active) {
      border-color: var(--text-dim);
      color: var(--text-mid);
    }

    .src-btn.active {
      background: rgba(0, 212, 255, .08);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .src-btn#src-synop.active {
      background: rgba(255, 176, 0, .08);
      border-color: var(--amber);
      color: var(--amber);
    }

    #sb-head h1 {
      font-family: var(--head);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--cyan);
    }

    #sb-head .sub {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 2px;
      letter-spacing: .05em;
    }

    /* Status */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      font-size: 11px;
    }

    #status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
      transition: background .3s;
      flex-shrink: 0;
    }

    #status-dot.loading {
      background: var(--amber);
      animation: pulse 1.2s ease-in-out infinite;
    }

    #status-dot.ok {
      background: var(--green);
    }

    #status-dot.error {
      background: var(--red);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    #status-text {
      color: var(--text-mid);
      flex: 1;
    }

    #station-count {
      color: var(--text-dim);
      white-space: nowrap;
      font-family: var(--mono);
      font-size: 10px;
    }

    /* Tile switcher */
    #tile-row {
      display: flex;
      gap: 4px;
      padding: 8px 12px;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tile-btn {
      flex: 1;
      padding: 4px 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: var(--head);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .05em;
      border-radius: 4px;
      cursor: pointer;
      transition: all .15s;
      text-transform: uppercase;
    }

    .tile-btn.active {
      background: var(--border2);
      color: var(--text);
      border-color: var(--border2);
    }

    .tile-btn:hover:not(.active) {
      border-color: var(--text-dim);
      color: var(--text-mid);
    }

    /* Param selection */
    /* ── OVERLAYS ── */
    #overlay-section {
      flex-shrink: 0;
      padding: 8px 12px 10px;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
    }

    #overlay-title {
      font-family: var(--head);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    #overlay-btns {
      display: flex;
      gap: 5px;
      margin-bottom: 6px;
    }

    .ov-btn {
      flex: 1;
      padding: 5px 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: var(--head);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .05em;
      border-radius: 5px;
      cursor: pointer;
      transition: all .15s;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .ov-btn:hover:not(.active) {
      border-color: var(--text-dim);
      color: var(--text-mid);
    }

    .ov-btn.active {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(0, 212, 255, .08);
    }

    .ov-btn[data-ov="sat"].active {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(255, 176, 0, .08);
    }

    .ov-icon {
      font-size: 13px;
    }

    #overlay-controls {
      padding-top: 4px;
    }

    #ov-time-info {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--green);
      margin-bottom: 5px;
      text-align: center;
      letter-spacing: .04em;
    }

    #ov-opacity-row,
    #ov-satproduct-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .ov-label {
      font-size: 10px;
      color: var(--text-dim);
      min-width: 52px;
    }

    #ov-opacity {
      flex: 1;
      -webkit-appearance: none;
      height: 3px;
      background: var(--border2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    #ov-opacity::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
      border: 2px solid var(--bg);
    }

    #ov-opacity-val {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      min-width: 28px;
    }

    #ov-colorscheme,
    #ov-satproduct {
      flex: 1;
      background: var(--panel3);
      border: 1px solid var(--border);
      color: var(--text-mid);
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }

    #ov-colorscheme:hover,
    #ov-satproduct:hover {
      border-color: var(--border2);
    }

    #param-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    #param-scroll::-webkit-scrollbar {
      width: 4px;
    }

    #param-scroll::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 2px;
    }

    .param-group {
      margin-bottom: 14px;
    }

    .param-group-title {
      font-family: var(--head);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0 4px 5px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }

    .param-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: background .12s;
      user-select: none;
      border: 1px solid transparent;
    }

    .param-item:hover {
      background: var(--panel3);
    }

    .param-item.sel-1 {
      background: rgba(0, 212, 255, .08);
      border-color: rgba(0, 212, 255, .2);
    }

    .param-item.sel-2 {
      background: rgba(255, 176, 0, .08);
      border-color: rgba(255, 176, 0, .2);
    }

    .sel-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--border2);
      flex-shrink: 0;
      transition: all .15s;
    }

    .param-item.sel-1 .sel-dot {
      background: var(--cyan);
      border-color: var(--cyan);
    }

    .param-item.sel-2 .sel-dot {
      background: var(--amber);
      border-color: var(--amber);
    }

    .param-name {
      font-size: 12px;
      flex: 1;
    }

    .param-slot {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      display: none;
      letter-spacing: .05em;
    }

    .param-item.sel-1 .param-slot {
      display: block;
      background: rgba(0, 212, 255, .15);
      color: var(--cyan);
    }

    .param-item.sel-2 .param-slot {
      display: block;
      background: rgba(255, 176, 0, .15);
      color: var(--amber);
    }

    /* Legend */
    #legend-section {
      flex-shrink: 0;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: var(--panel2);
    }

    #legend-title {
      font-family: var(--head);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .legend-block {
      margin-bottom: 8px;
    }

    .legend-label {
      font-family: var(--head);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .legend-gradient {
      height: 12px;
      border-radius: 3px;
      margin-bottom: 3px;
    }

    .legend-range {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-dim);
    }

    .legend-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .cs-badge {
      padding: 2px 7px;
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    /* ── TIME CONTROL ── */
    #time-wrap {
      position: absolute;
      left: var(--sb-w);
      right: 0;
      bottom: 24px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 1000;
    }

    #time-ctrl {
      pointer-events: all;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 10px 18px;
      min-width: 440px;
      box-shadow: 0 6px 28px rgba(0, 0, 0, .65);
      backdrop-filter: blur(4px);
    }

    #time-display {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--green);
      white-space: nowrap;
      min-width: 160px;
      text-align: center;
      letter-spacing: .03em;
    }

    #time-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 3px;
      background: var(--border2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    #time-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
      border: 2px solid var(--bg);
    }

    .t-btn {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text-mid);
      padding: 5px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      transition: all .15s;
      white-space: nowrap;
    }

    .t-btn:hover {
      background: var(--cyan);
      color: var(--bg);
      border-color: var(--cyan);
    }

    /* ── LEAFLET OVERRIDES ── */
    .leaflet-popup-content-wrapper {
      background: var(--panel) !important;
      border: 1px solid var(--border2) !important;
      border-radius: 8px !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .7) !important;
      color: var(--text) !important;
    }

    .leaflet-popup-content {
      margin: 14px 16px !important;
    }

    .leaflet-popup-tip-container .leaflet-popup-tip {
      background: var(--panel) !important;
    }

    .leaflet-popup-close-button {
      color: var(--text-dim) !important;
      font-size: 16px !important;
      right: 10px !important;
      top: 10px !important;
    }

    .leaflet-control-zoom a {
      background: var(--panel) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .leaflet-control-zoom a:hover {
      background: var(--panel3) !important;
    }

    .leaflet-control-attribution {
      background: rgba(8, 12, 20, .75) !important;
      color: var(--text-dim) !important;
      font-size: 9px !important;
    }

    .leaflet-control-attribution a {
      color: var(--text-dim) !important;
    }

    /* ── LOADING OVERLAY ── */
    #loading-overlay {
      position: absolute;
      left: var(--sb-w);
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 900;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .25s;
    }

    #loading-overlay.visible {
      opacity: 1;
    }

    #loading-box {
      background: rgba(8, 12, 20, .88);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .7);
      backdrop-filter: blur(6px);
    }

    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid var(--border2);
      border-top-color: var(--cyan);
      animation: spin .8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loading-msg {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-mid);
      letter-spacing: .04em;
    }

    #loading-sub {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 3px;
      font-family: var(--body);
    }

    .leaflet-bottom.leaflet-right {
      bottom: 80px !important;
    }

    /* Allow translated markers to overflow their 1x1 anchor point */
    .leaflet-marker-pane .leaflet-mm-marker {
      overflow: visible !important;
    }

    /* Custom tooltip override */
    .leaflet-tooltip.metar-tt {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }

    .leaflet-tooltip.metar-tt::before {
      display: none !important;
    }

    /* ── POPUP CONTENT ── */
    .pop-head {
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .pop-icao {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      color: var(--cyan);
    }

    .pop-name {
      font-size: 12px;
      color: var(--text-mid);
      margin-top: 2px;
    }

    .pop-meta {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .pop-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      vertical-align: middle;
      margin-left: 8px;
    }

    .pop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      margin-bottom: 10px;
    }

    .pop-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 7px;
      background: var(--panel2);
      border-radius: 3px;
    }

    .pop-key {
      color: var(--text-dim);
      font-size: 11px;
    }

    .pop-val {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
    }

    .pop-raw {
      font-family: var(--mono);
      font-size: 10px;
      background: var(--bg);
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      word-break: break-all;
      line-height: 1.7;
      color: var(--text-mid);
      white-space: pre-wrap;
      margin-top: 8px;
    }

    .pop-sky {
      margin-bottom: 8px;
    }

    .pop-sky-title {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 5px;
      letter-spacing: .08em;
    }

    .sky-chip {
      display: inline-block;
      background: var(--panel2);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 11px;
      margin: 2px 2px 2px 0;
    }

    /* ── TAB NAVIGATION ── */
    #tab-nav {
      display: flex;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .tab-btn {
      flex: 1;
      padding: 7px 4px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      font-family: var(--head);
      font-size: 10.5px;
      letter-spacing: .05em;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
    }

    .tab-panel {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .tab-panel.active {
      display: flex;
    }

    /* ── MONITOR TAB ── */
    #tab-monitor {
      overflow-y: auto;
      padding: 8px;
    }

    #tab-monitor::-webkit-scrollbar {
      width: 4px;
    }

    #tab-monitor::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 2px;
    }

    .mon-section {
      margin-bottom: 14px;
    }

    .mon-head {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }

    .mon-title {
      flex: 1;
      font-family: var(--head);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--text-mid);
    }

    .mon-raw-label {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }

    .mon-raw-label input {
      margin: 0;
      cursor: pointer;
    }

    .mon-refbtn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      cursor: pointer;
      line-height: 1.4;
    }

    .mon-refbtn:hover {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .mon-card {
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 5px;
      overflow: hidden;
    }

    .mon-card-hdr {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
    }

    .mon-id-input {
      flex: 1;
      background: transparent;
      border: none;

  <script>
    // ═══════════════════════════════════════════════════════════════
    // CONSTANTS & PARAMETER DEFINITIONS
    // ═══════════════════════════════════════════════════════════════

    const PARAMS = [
      { id: 'colorstate', label: 'Color State', unit: '', group: 'Sicht & Ceiling' },
      { id: 'visibility', label: 'Sicht', unit: 'm', group: 'Sicht & Ceiling' },
      { id: 'ceiling', label: 'Ceiling', unit: 'hft', group: 'Sicht & Ceiling' },
      { id: 'clouds_lo', label: 'Tiefe Wolken', unit: 'hft', group: 'Wolken' },

      { id: 'clouds_hi', label: 'Hohe Wolken', unit: 'hft', group: 'Wolken' },
      { id: 'wind_barb', label: 'Windfeder', unit: 'kt', group: 'Wind' },
      { id: 'wind_dir', label: 'Windrichtung', unit: '°', group: 'Wind' },
      { id: 'wind_speed', label: 'Windgeschwindigkeit', unit: 'kt', group: 'Wind' },
      { id: 'wind_gust', label: 'Böen', unit: 'kt', group: 'Wind' },
      { id: 'pressure', label: 'Druck (QNH)', unit: 'hPa', group: 'Atmosphäre' },
      { id: 'pres_tend', label: 'Druckänderung*', unit: 'hPa', group: 'Atmosphäre' },
      { id: 'ww', label: 'WW (Wetter)', unit: '', group: 'Atmosphäre' },
      { id: 'temperature', label: 'Temperatur', unit: '°C', group: 'Temp / Feuchte' },
      { id: 'dewpoint', label: 'Taupunkt', unit: '°C', group: 'Temp / Feuchte' },
    ];
    const PARAM_GROUPS = ['Sicht & Ceiling', 'Wolken', 'Wind', 'Atmosphäre', 'Temp / Feuchte'];

    // NATO Color State thresholds (worst of visibility OR ceiling applies)
    const CS = [
      { name: 'BLUE PLUS', abbr: 'BLU+', bg: '#00B0FF', fg: '#003366', cFt: 20000, vMtr: 8000 },
      { name: 'BLUE', abbr: 'BLU', bg: '#1565C0', fg: '#ffffff', cFt: 2500, vMtr: 8000 },
      { name: 'WHITE', abbr: 'WHT', bg: '#e0e0e0', fg: '#111111', cFt: 1500, vMtr: 5000 },
      { name: 'GREEN', abbr: 'GRN', bg: '#2E7D32', fg: '#ffffff', cFt: 700, vMtr: 3700 },
      { name: 'YELLOW', abbr: 'YLO', bg: '#F9A825', fg: '#111111', cFt: 500, vMtr: 2400 },
      { name: 'AMBER', abbr: 'AMB', bg: '#E65100', fg: '#ffffff', cFt: 200, vMtr: 800 },
      { name: 'RED', abbr: 'RED', bg: '#B71C1C', fg: '#ffffff', cFt: 0, vMtr: 0 },
    ];

    const MAX_MARKERS = 700;
    const CACHE_TTL = 4.5 * 60 * 1000;
    const AUTO_REFRESH = 2 * 60 * 1000;

    // MeteoMap Hetzner API – OGIMET-Proxy mit Cache.
    // Leer lassen wenn der Client selbst vom Hetzner-Server ausgeliefert wird (relative URLs).
    const SYNOP_API = '';  // relative URLs – nginx proxied /meteomap/ → port 8001

    // ── Origin-aware request routing ──────────────────────────────
    //  file://   → CORS blocked everywhere; show setup hint
    //  localhost → use local proxy (/proxy?url=...)
    //  real host → direct fetch (server sets CORS headers)
    function resolveUrl(rawUrl) {
      // Always proxy external URLs through server to avoid CORS restrictions
      if (rawUrl.startsWith('http')) {
        return `/proxy?url=${encodeURIComponent(rawUrl)}`;
      }
      return rawUrl;
    }

    function isFileProtocol() { return location.protocol === 'file:'; }

    async function corsGet(rawUrl) {
      if (isFileProtocol()) {
        // Show one-time setup banner
        if (!window._fileWarnShown) {
          window._fileWarnShown = true;
          showFileProtocolBanner();
        }
        throw new Error('file://-Origin blockiert – bitte server.py starten');
      }
      const url = resolveUrl(rawUrl);
      const r = await fetch(url, { signal: AbortSignal.timeout(20000) });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r;
    }

    function showFileProtocolBanner() {
      const b = document.createElement('div');
      b.style.cssText = `
    position:fixed;top:0;left:0;right:0;z-index:9999;
    background:#7c2600;color:#ffd0b0;
    font-family:'JetBrains Mono',monospace;font-size:12px;
    padding:14px 20px;line-height:1.7;border-bottom:2px solid #ff6030;`;
      b.innerHTML = `
    <strong style="font-size:14px;color:#ffcc80;">⚠ Datei direkt geöffnet – CORS blockiert alle Netzwerkzugriffe</strong><br>
    Lösung: <code style="background:rgba(0,0,0,.35);padding:1px 6px;border-radius:3px;">python server.py</code>
    im selben Ordner starten, dann
    <a href="http://localhost:8765/meteomap.html" target="_blank"
       style="color:#80d8ff;text-decoration:underline;">http://localhost:8765/meteomap.html</a> öffnen.
    <button onclick="this.parentElement.remove()" style="float:right;background:none;border:1px solid #ff8060;
      color:#ffcc80;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:11px;">✕</button>`;
      document.body.prepend(b);
    }

    // App state
    let selectedParams = ['colorstate'];
    let timeOffset = 0;          // hours from now (0 = current)
    let allObs = [];         // all fetched observations for current window
    let markerLayer = null;
    let autoTimer = null;
    let isLoading = false;
    const dataCache = new Map();

    // ═══════════════════════════════════════════════════════════════
    // DATA SOURCE MANAGEMENT
    // ═══════════════════════════════════════════════════════════════

    let activeSources = new Set(['metar']); // 'metar' | 'synop'
    let wmoStations = null;               // loaded from wmo_stations.json
    const missingStationCache = new Map();  // wmoId → station obj (fetched on demand)
    let synopObs = [];                 // parsed SYNOP observations
    const ogimetTextCache = new Map();  // `${block}|${hoursKey}` → { text, ts }
    const SYNOP_BLOCK_TTL = 10 * 60 * 1000;
    const bufrCache = new Map();        // bboxStr → { obs, ts }
    const BUFR_CACHE_TTL = 10 * 60 * 1000;

    // ── Source toggle setup ───────────────────────────────────────
    function setupSourceToggles() {
      document.getElementById('src-metar').addEventListener('click', () => toggleSource('metar'));
      document.getElementById('src-synop').addEventListener('click', () => toggleSource('synop'));
    }

    function toggleSource(src) {
      if (activeSources.has(src) && activeSources.size === 1) return; // keep at least one
      if (activeSources.has(src)) {
        activeSources.delete(src);
        if (src === 'synop') synopObs = [];
      } else {
        activeSources.add(src);
      }
      document.getElementById('src-metar').classList.toggle('active', activeSources.has('metar'));
      document.getElementById('src-synop').classList.toggle('active', activeSources.has('synop'));
      // Clear everything and force a clean redraw
      allObs = [];
      synopObs = [];
      dataCache.clear();
      if (markerLayer) { map.removeLayer(markerLayer); markerLayer = null; }
      updateDisplay();
    }

    // ── WMO Station DB ────────────────────────────────────────────
    async function loadWmoStations() {
      if (wmoStations) return wmoStations;
      try {
        const r = await fetch('/wmo_stations.json');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        wmoStations = await r.json();
        console.log(`WMO-Stationsliste geladen: ${wmoStations.length} Stationen`);
        return wmoStations;
      } catch (e) {
        console.warn('wmo_stations.json nicht gefunden:', e.message);
        showSynopHint();
        return null;
      }
    }

    function showSynopHint() {
      if (document.getElementById('synop-hint')) return;
      const el = document.createElement('div');
      el.id = 'synop-hint';
      el.style.cssText = `position:fixed;top:0;left:0;right:0;z-index:9999;
    background:#4a3000;color:#ffd080;font-family:'JetBrains Mono',monospace;font-size:11px;
    padding:12px 18px;line-height:1.7;border-bottom:2px solid #ffaa00;`;
      el.innerHTML = `<strong>⚠ SYNOP: wmo_stations.json fehlt</strong><br>
    Bitte einmalig <code>python fetch_wmo_stations.py</code> ausführen und die Datei
    in den MeteoMap-Ordner legen.
    <button onclick="this.parentElement.remove()" style="float:right;background:none;
      border:1px solid #ffaa00;color:#ffd080;padding:2px 10px;border-radius:4px;cursor:pointer;">✕</button>`;
      document.body.prepend(el);
    }

    function stationById(wmoId) {
      if (!wmoId) return null;
      const id = parseInt(wmoId);
      // Check main DB
      if (wmoStations) {
        const found = wmoStations.find(s => s.wmo === id);
        if (found) return found;
      }
      // Check on-demand cache
      return missingStationCache.get(id) || null;
    }

    // Batch-fetch station coords for WMO IDs not in our DB
    // AWC stationinfo only accepts ICAO codes, not WMO IDs → use chunked requests
    // with ICAO lookup as best-effort. Primary fix is running fetch_wmo_stations.py v2.
    async function fetchMissingStations(wmoIds) {
      const missing = wmoIds.filter(id => !stationById(id));
      if (!missing.length) return;
      console.log(`${missing.length} Stationen nicht in DB (wmo_stations.json neu erstellen empfohlen)`);
      // No reliable batch API for WMO→coords without ICAO.
      // Stations will be missing until wmo_stations.json is rebuilt with fetch_wmo_stations.py v2.
    }

    // ── OGIMET SYNOP Fetch ────────────────────────────────────────
    // Determines which WMO blocks overlap the current map bbox,
    // fetches SYNOP strings from OGIMET via server.py proxy, parses them.

    // Static WMO block → approximate geographic coverage
    // Overlap check: does block region intersect the map bbox?
    const WMO_BLOCKS = [
      { b: 1, s: 55, n: 90, w: -90, e: 20 },  // Iceland, Greenland
      { b: 2, s: 49, n: 72, w: -12, e: 5 },  // UK, Ireland, Norway coast
      { b: 3, s: 41, n: 55, w: -10, e: 10 },  // France (incl. Corsica ~9°E)
      { b: 4, s: 25, n: 50, w: -20, e: 10 },  // Azores, NW Africa
      { b: 5, s: 10, n: 40, w: -20, e: 25 },  // N Africa W
      { b: 6, s: 44, n: 75, w: 3, e: 35 },  // Scandinavia + Netherlands/Belgium/Switzerland
      { b: 7, s: 35, n: 65, w: 0, e: 22 },  // Benelux, Denmark, N/C Europe
      { b: 8, s: 10, n: 40, w: 5, e: 35 },  // N Africa C
      { b: 9, s: 10, n: 40, w: 25, e: 55 },  // N Africa E
      { b: 10, s: 46, n: 56, w: 5, e: 16 },  // Germany, Austria-W, Switzerland-E
      { b: 11, s: 43, n: 56, w: 12, e: 27 },  // Austria-E, Czech, Slovakia, Hungary, Croatia-N
      { b: 12, s: 48, n: 56, w: 14, e: 25 },  // Poland
      { b: 13, s: 43, n: 58, w: 22, e: 38 },  // Romania, Ukraine W
      { b: 14, s: 40, n: 56, w: 14, e: 35 },  // Balkans, Croatia, Serbia, Bosnia
      { b: 15, s: 35, n: 45, w: -10, e: 5 },  // Iberia
      { b: 16, s: 35, n: 48, w: 5, e: 20 },  // Italy, Adriatic coast
      { b: 17, s: 30, n: 45, w: 25, e: 45 },  // Turkey, Middle East
      { b: 20, s: 55, n: 75, w: 25, e: 65 },  // Russia W
      { b: 21, s: 55, n: 75, w: 55, e: 95 },  // Russia C
      { b: 23, s: 50, n: 70, w: 55, e: 100 },  // Russia
      { b: 24, s: 45, n: 65, w: 85, e: 135 },  // Russia E
      { b: 25, s: 55, n: 80, w: 95, e: 150 },  // Russia far E
      { b: 26, s: 44, n: 60, w: 23, e: 42 },  // Ukraine, Belarus
      { b: 27, s: 50, n: 68, w: 35, e: 65 },  // Russia Urals
      { b: 28, s: 35, n: 55, w: 50, e: 80 },  // Central Asia
      { b: 30, s: 25, n: 45, w: 45, e: 75 },  // Iran, Afghanistan
      { b: 31, s: 15, n: 40, w: 0, e: 25 },  // N Africa / Sahara
      { b: 32, s: 0, n: 25, w: 0, e: 25 },  // W Africa
      { b: 33, s: -20, n: 10, w: 0, e: 30 },  // C Africa
      { b: 34, s: -40, n: 5, w: 10, e: 45 },  // S Africa W
      { b: 35, s: -40, n: 5, w: 30, e: 55 },  // S Africa E
      { b: 40, s: 15, n: 40, w: 35, e: 75 },  // Arabian Peninsula
      { b: 41, s: 5, n: 30, w: 60, e: 80 },  // Pakistan, NW India
      { b: 42, s: 10, n: 35, w: 65, e: 90 },  // India
      { b: 43, s: 10, n: 30, w: 85, e: 110 },  // SE Asia N
      { b: 44, s: -10, n: 20, w: 90, e: 125 },  // SE Asia S
      { b: 45, s: 20, n: 45, w: 95, e: 135 },  // China
      { b: 46, s: 30, n: 55, w: 100, e: 145 },  // China N, Korea
      { b: 47, s: 25, n: 50, w: 125, e: 150 },  // Japan
      { b: 48, s: -10, n: 30, w: 100, e: 135 },  // SE Asia
      { b: 60, s: -30, n: 35, w: -20, e: 20 },  // W Africa
      { b: 61, s: -20, n: 20, w: 20, e: 55 },  // E Africa
      { b: 71, s: 45, n: 80, w: -145, e: -55 },  // Canada
      { b: 72, s: 25, n: 50, w: -130, e: -65 },  // USA E
      { b: 74, s: 15, n: 30, w: -100, e: -65 },  // Mexico, Caribbean
      { b: 76, s: -10, n: 25, w: -95, e: -55 },  // C America
      { b: 80, s: -60, n: 15, w: -85, e: -30 },  // S America
      { b: 89, s: -90, n: -60, w: -180, e: 180 },  // Antarctica
      { b: 94, s: -45, n: -10, w: 110, e: 160 },  // Australia
      { b: 96, s: -30, n: 10, w: 130, e: 180 },  // Pacific W
    ];

    function blocksForBbox(west, south, east, north) {
      return WMO_BLOCKS
        .filter(r => r.s < north && r.n > south && r.w < east && r.e > west)
        .map(r => r.b)
        .sort((a, b) => a - b);
    }

    async function fetchOgimetSynop(block, hours) {
      const url = `${SYNOP_API}/meteomap/ogimet/${block}?hours=${hours.toFixed(1)}`;
      const r = await fetch(url, { signal: AbortSignal.timeout(25000) });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.text();
    }

    // ── Phase 1: OGIMET via Hetzner-Cache (schnell, < 2 s) ───────
    async function fetchOgimetObs(bounds, hours) {
      const stations = await loadWmoStations();
      if (!stations) return [];

      const w = bounds.getWest(), s = bounds.getSouth(), e = bounds.getEast(), n = bounds.getNorth();
      const blocks = blocksForBbox(w, s, e, n);
      if (!blocks.length) return [];

      const now = Date.now();
      const hoursKey = (Math.round(hours * 2) / 2).toFixed(1);

      const staleBlocks = blocks.filter(b => {
        const c = ogimetTextCache.get(`${b}|${hoursKey}`);
        return !c || now - c.ts >= SYNOP_BLOCK_TTL;
      });
      const cachedCount = blocks.length - staleBlocks.length;

      if (staleBlocks.length > 0) {
        setStatusTxt(`SYNOP: lade ${staleBlocks.length} Blöcke … (${cachedCount} Cache)`);
      }

      await Promise.all(
        staleBlocks.map(block =>
          fetchOgimetSynop(block, hours)
            .then(text => ogimetTextCache.set(`${block}|${hoursKey}`, { text, ts: Date.now() }))
            .catch(() => ogimetTextCache.set(`${block}|${hoursKey}`, { text: '', ts: Date.now() }))
        )
      );

      const obs = blocks.flatMap(b => {
        const c = ogimetTextCache.get(`${b}|${hoursKey}`);
        return (c && c.text) ? parseSynopBlock(c.text, stations, w, s, e, n) : [];
      });
      console.log(`OGIMET → ${obs.length} Stationen (${cachedCount}/${blocks.length} Cache)`);
      return obs;
    }

    // ── Phase 2: DWD BUFR (langsam, im Hintergrund) ───────────────
    async function fetchBufrObs(bounds, hours) {
      const w = bounds.getWest(), s = bounds.getSouth(), e = bounds.getEast(), n = bounds.getNorth();
      const bboxStr = `${s.toFixed(2)},${w.toFixed(2)},${n.toFixed(2)},${e.toFixed(2)}`;

      const cached = bufrCache.get(bboxStr);
      if (cached && Date.now() - cached.ts < BUFR_CACHE_TTL) {
        console.log(`DWD BUFR → ${cached.obs.length} (Cache)`);
        return cached.obs;
      }

      const obs = await fetch(`${SYNOP_API}/meteomap/bufr?bbox=${bboxStr}`,
        { signal: AbortSignal.timeout(15000) })
        .then(r => r.ok ? r.json() : [])
        .catch(() => []);

      bufrCache.set(bboxStr, { obs, ts: Date.now() });
      console.log(`DWD BUFR → ${obs.length} Stationen (Hetzner)`);
      return obs;
    }

    // Merged OGIMET + BUFR: BUFR bevorzugt (bessere Qualität)
    function mergeOgimetBufr(ogimetObs, bufrObs) {
      const seen = new Map();
      for (const o of ogimetObs) { const k = o.wmoId || o.icaoId; if (k) seen.set(k, o); }
      for (const o of bufrObs)   { const k = o.wmoId || o.icaoId; if (k) seen.set(k, o); }
      return [...seen.values()];
    }

    // METAR über SYNOP bevorzugt für gleiche Station
    function dedupMetarSynop(combined) {
      const seen = new Map();
      for (const o of combined) {
        const key = o.wmoId ? `wmo${o.wmoId}` : `icao${o.icaoId}`;
        if (!seen.has(key) || o.metarType !== 'SYNOP') seen.set(key, o);
      }
      return [...seen.values()];
    }

    // ── FM-12 SYNOP Parser ────────────────────────────────────────
    // OGIMET format (comma-separated):
    // "10007,2026,04,19,05,00,AAXX 19051 10007 46/60 /2803 10079 20077 ..."
    //  [0]wmo [1]yr [2]mo [3]dy [4]hr [5]mn  [6] raw SYNOP string

    function parseSynopBlock(text, stations, west, south, east, north) {
      const result = [];
      for (const line of text.split('\n')) {
        const l = line.trim().replace(/=+$/, '');
        if (!l || l.startsWith('#')) continue;
        try {
          const obs = parseSynopLine(l, stations);
          if (!obs) continue;
          if (obs.lat < south || obs.lat > north ||
            obs.lon < west || obs.lon > east) continue;
          result.push(obs);
        } catch (e) { /* skip malformed */ }
      }
      return result;
    }

    function parseSynopLine(line, stations) {
      // Split on comma – OGIMET always uses comma
      const parts = line.split(',');
      if (parts.length < 7) return null;

      const wmoId = parseInt(parts[0]);
      if (isNaN(wmoId)) return null;
      const st = stationById(wmoId);
      if (!st) return null;

      // Date: parts[1]=year, [2]=month, [3]=day, [4]=hour, [5]=minute
      const yr = parseInt(parts[1]), mo = parseInt(parts[2]);
      const dy = parseInt(parts[3]), hr = parseInt(parts[4]), mn = parseInt(parts[5]);
      if (isNaN(yr) || isNaN(hr)) return null;
      const obsTime = Math.round(
        new Date(Date.UTC(yr, mo - 1, dy, hr, mn || 0)).getTime() / 1000);

      // Raw SYNOP is everything from parts[6] onward (rejoin in case commas inside)
      const raw = parts.slice(6).join(',').trim();

      const obs = {
        icaoId: `WMO${String(wmoId).padStart(5, '0')}`,
        wmoId,
        name: st.name,
        lat: st.lat,
        lon: st.lon,
        elev: st.elev,
        country: st.country,
        obsTime,
        rawOb: raw,
        metarType: 'SYNOP',
        temp: null, dewp: null, wspd: null, wdir: null,
        wgst: null, visib: null, altim: null, slp: null,
        wxString: null, skyCondition: [], presTend: null,
      };

      // ── Parse FM-12 body ──────────────────────────────────────
      // Find AAXX header and extract wind indicator
      const aaM = raw.match(/AAXX\s+(\d{2})(\d{2})(\d{1})/);
      const windIndicator = aaM ? parseInt(aaM[3]) : 1; // 1=m/s, 4=knots

      // Tokenise the SYNOP groups (5-char groups)
      const tokens = raw.replace(/AAXX\s+\d{5}/, '').trim().split(/\s+/);
      // First token after header is IIiii (station number) – skip it
      let i = 0;
      if (tokens[i] && /^\d{5}$/.test(tokens[i])) i++;

      // Group: irixhVV  (precipitation indicator, station type, h, visibility)
      if (tokens[i] && /^[0-9\/]{5}$/.test(tokens[i])) {
        const VVraw = tokens[i].slice(3, 5);
        const VV = parseInt(VVraw);
        if (!isNaN(VV)) {
          let visMtr = null;
          if (VV <= 50) visMtr = VV * 100;
          else if (VV <= 80) visMtr = (VV - 50) * 1000;
          else if (VV === 81) visMtr = 30;
          else if (VV === 82) visMtr = 50;
          else if (VV === 83) visMtr = 100;
          else if (VV === 84) visMtr = 200;
          else if (VV === 85) visMtr = 500;
          else if (VV === 86) visMtr = 1000;
          else if (VV === 87) visMtr = 2000;
          else if (VV === 88) visMtr = 5000;
          else if (VV === 89) visMtr = 9999;
          else if (VV === 90) visMtr = 50;
          else if (VV === 91) visMtr = 200;
          else if (VV === 92) visMtr = 500;
          else if (VV === 93) visMtr = 1000;
          else if (VV === 94) visMtr = 2000;
          else if (VV === 95) visMtr = 4000;
          else if (VV === 96) visMtr = 10000;
          else if (VV === 97) visMtr = 20000;
          else if (VV === 98) visMtr = 50000;
          else if (VV === 99) visMtr = 9999;  // ≥70 km
          obs.visib = visMtr !== null ? String(visMtr) : null;
        }
        i++;
      }

      // Group: Nddff  (cloud cover, wind direction, wind speed)
      if (tokens[i] && /^[0-9\/]{5}$/.test(tokens[i])) {
        const N = tokens[i][0];
        const dd = parseInt(tokens[i].slice(1, 3));
        const ff = parseInt(tokens[i].slice(3, 5));
        if (!isNaN(dd)) obs.wdir = dd === 99 ? 'VRB' : dd * 10;
        if (!isNaN(ff)) {
          // iw=0,1,2 → m/s → convert to kt; iw=3,4 → already knots
          obs.wspd = (windIndicator <= 2) ? Math.round(ff * 1.944) : ff;
        }
        if (N !== '/') {
          const nVal = parseInt(N);
          const covers = ['SKC', 'FEW', 'FEW', 'SCT', 'SCT', 'BKN', 'BKN', 'BKN', 'OVC', 'OVC'];
          const cover = covers[nVal];
          if (cover && cover !== 'SKC')
            obs.skyCondition = [{ skyCover: cover, cloudBase: null }];
        }
        i++;
      }

      // Remaining groups: search by prefix digit
      for (; i < tokens.length; i++) {
        const t = tokens[i];
        if (!t || t === '/////') continue;

        // 1SnTTT – air temperature
        if (/^1[01]\d{3}$/.test(t)) {
          const T = parseInt(t.slice(2)) / 10;
          obs.temp = t[1] === '1' ? -T : T;
        }
        // 2SnTdTdTd – dew point
        else if (/^2[01]\d{3}$/.test(t)) {
          const D = parseInt(t.slice(2)) / 10;
          obs.dewp = t[1] === '1' ? -D : D;
        }
        // 3PPPP – station pressure QFE → convert to QNH via ISA
        else if (/^3\d{4}$/.test(t)) {
          const raw3 = parseInt(t.slice(1)) / 10;
          const qfe = raw3 < 500 ? raw3 + 1000 : raw3;
          obs.slp = qfe;  // store QFE temporarily
          // ISA reduction: QNH = QFE × (1 + Γh/T)^(g/ΓR)
          // Γ=0.0065 K/m, g/ΓR=5.2561
          const h = (obs.elev != null) ? obs.elev : 0;
          const T = (obs.temp != null) ? obs.temp + 273.15 : 288.15; // ISA if no temp yet
          obs.altim = Math.round(qfe * Math.pow(1 + 0.0065 * h / T, 5.2561) * 10) / 10;
        }
        // 4PPPP – standard-level reduced pressure; store as slp reference but
        // do NOT use as altim — it's unreliable for elevated stations
        else if (/^4\d{4}$/.test(t)) {
          const raw4 = parseInt(t.slice(1)) / 10;
          // Only use as fallback if we have no group-3 pressure at all
          if (obs.altim === null) {
            obs.slp = raw4 < 500 ? raw4 + 1000 : raw4;
            obs.altim = obs.slp;  // flat terrain only, flagged as approximate
          }
        }
        // 5appp – pressure tendency
        else if (/^5[0-8]\d{3}$/.test(t)) {
          const a = parseInt(t[1]);
          const ppp = parseInt(t.slice(2)) / 10;
          obs.presTend = (a >= 5) ? -ppp : ppp;
        }
        // 7wwW1W2 – present and past weather
        else if (/^7\d{4}$/.test(t)) {
          const ww = parseInt(t.slice(1, 3));
          if (ww > 3) {
            const mapped = synopWW(ww);
            if (mapped && mapped.includes('TS'))
              console.warn(`[SYNOP WW] Station ${obs.wmoId} ww=${ww} Gruppe="${t}" → "${mapped}"`);
            obs.wxString = mapped;
          }
        }
        // Section 3 marker: stop at 333
        else if (t === '333') break;
      }

      // Post-process: recalculate QNH with actual temperature
      if (obs.slp && obs.temp !== null && obs.elev) {
        const T = obs.temp + 273.15;
        const h = obs.elev;
        obs.altim = Math.round(obs.slp * Math.pow(1 + 0.0065 * h / T, 5.2561) * 10) / 10;
      }

      // ── Section 3: additional groups after '333' ─────────────
      // Parse additional sections: Section 3 (after 333) AND Section 5 (after 555)
      // France and some other countries put gust data in Section 5
      const sec3Start = tokens.indexOf('333');
      const sec5Start = tokens.indexOf('555');
      const additionalTokens = [];
      if (sec3Start >= 0) additionalTokens.push(...tokens.slice(sec3Start + 1));
      if (sec5Start >= 0) additionalTokens.push(...tokens.slice(sec5Start + 1));
      const sec3 = additionalTokens; // renamed variable, both sections combined

      if (sec3.length > 0) {
        for (const t of sec3) {
          if (!t || t.length !== 5) continue;

          // SpSp=11 → max instantaneous gust (universal European practice)
          // SpSp=10 → max 10-min mean wind (fallback if no SpSp=11)
          // SpSp=07 → mean wind at anemometer height (= Section 1 wind, NOT a gust → skip)
          if (/^911\d{2}$/.test(t)) {
            const ff = parseInt(t.slice(3, 5));
            if (!isNaN(ff) && ff > 0 && ff <= 51) {
              obs.wgst = (windIndicator <= 2) ? Math.round(ff * 1.944) : ff;
            }
          } else if (/^910\d{2}$/.test(t) && !obs.wgst) {
            // 910ff = highest 10-min mean: use as gust fallback only if no 911ff found
            const ff = parseInt(t.slice(3, 5));
            if (!isNaN(ff) && ff > 0 && ff <= 51) {
              obs._wspd10 = (windIndicator <= 2) ? Math.round(ff * 1.944) : ff;
            }
          }

          // Detailed cloud: Ns Ns Cs hs  (amount, genus, height)
          // Group format: NsNsCshs  where Ns=1-9, Cs=cloud type 0-9, hs=height code
          // Encoded as 5-char: e.g. "83011" → Ns=3, Cs=0, hs=11
          // But these are Section 3 specific cloud groups starting with 8:
          if (/^8[0-9][/0-9][0-9][0-9]$/.test(t)) {
            const Ns = parseInt(t[1]);  // cloud amount
            const Cs = t[2];            // cloud genus (may be /)
            const hss = parseInt(t.slice(3, 5)); // height code
            if (!isNaN(Ns) && Ns > 0) {
              // WMO height code → approximate feet AGL
              const hFt = hss <= 9 ? hss * 100 :
                hss <= 56 ? (hss - 10) * 300 + 1000 :
                  hss <= 80 ? (hss - 56) * 1500 + 14500 :
                    hss <= 88 ? (hss - 80) * 6000 + 50500 : null;
              const cover = Ns <= 2 ? 'FEW' : Ns <= 4 ? 'SCT' : Ns <= 7 ? 'BKN' : 'OVC';
              if (hFt !== null) {
                obs.skyCondition.push({ skyCover: cover, cloudBase: hFt });
              }
            }
          }
        }
        // Deduplicate and distill: max 3 layers, merge bases within 500 ft
        const _CR = { SKC:0, FEW:1, SCT:2, BKN:3, OVC:4 };
        const _valid = obs.skyCondition.filter(l => l.cloudBase !== null);
        _valid.sort((a, b) => a.cloudBase - b.cloudBase);
        const _deduped = [];
        for (const l of _valid) {
          const ni = _deduped.findIndex(d => Math.abs(d.cloudBase - l.cloudBase) < 500);
          if (ni < 0) _deduped.push({ ...l });
          else if ((_CR[l.skyCover] || 0) > (_CR[_deduped[ni].skyCover] || 0))
            _deduped[ni] = { ...l };
        }
        // Keep: lowest ceiling + 1 layer below it + 2nd ceiling (if room)
        const _ceils  = _deduped.filter(l => l.skyCover === 'BKN' || l.skyCover === 'OVC');
        const _others = _deduped.filter(l => l.skyCover !== 'BKN' && l.skyCover !== 'OVC');
        if (_ceils.length) {
          const _below = _others.filter(l => l.cloudBase < _ceils[0].cloudBase).slice(-1);
          obs.skyCondition = [..._below, _ceils[0], ..._ceils.slice(1, 2)];
        } else {
          obs.skyCondition = _others.slice(0, 3);
        }
        obs.skyCondition.sort((a, b) => a.cloudBase - b.cloudBase);
      }
      // Apply 910ff fallback if no true gust (911ff) was found
      if (!obs.wgst && obs._wspd10 && obs.wspd && obs._wspd10 > obs.wspd) {
        obs.wgst = obs._wspd10;
      }
      delete obs._wspd10;

      return obs;
    }

    // WMO ww code → METAR-style wx string approximation
    // 91-94: Niederschlag *nach* Gewitter (TS nicht mehr aktiv); 17: TS ohne Niederschlag an Station
    function synopWW(ww) {
      if (ww >= 95 && ww <= 99) return 'TS';
      if (ww === 17) return 'TS';
      if (ww === 94) return 'SN';
      if (ww === 93) return 'RASN';
      if (ww === 92) return 'RA';
      if (ww === 91) return '-RA';
      if (ww >= 87 && ww <= 90) return '+SHSN';
      if (ww >= 83 && ww <= 86) return 'SHSN';
      if (ww >= 80 && ww <= 82) return 'SHRA';
      if (ww >= 77 && ww <= 79) return 'SN';
      if (ww >= 73 && ww <= 75) return 'SN';
      if (ww >= 71 && ww <= 72) return '-SN';
      if (ww >= 68 && ww <= 69) return 'RASN';
      if (ww >= 66 && ww <= 67) return 'FZRA';
      if (ww >= 64 && ww <= 65) return '+RA';
      if (ww >= 61 && ww <= 63) return 'RA';
      if (ww >= 58 && ww <= 60) return '-RA';
      if (ww >= 56 && ww <= 57) return 'FZDZ';
      if (ww >= 53 && ww <= 55) return 'DZ';
      if (ww >= 50 && ww <= 52) return '-DZ';
      if (ww >= 45 && ww <= 49) return 'FG';
      if (ww >= 41 && ww <= 44) return 'BR';
      if (ww === 31 || ww === 32) return 'DS';
      if (ww >= 30) return 'DU';
      if (ww === 10) return 'BR';
      return null;
    }

    // ═══════════════════════════════════════════════════════════════
    // COLOR HELPERS
    // ═══════════════════════════════════════════════════════════════

    function lerpColor(stops, val) {
      if (val <= stops[0].v) return `rgb(${stops[0].r},${stops[0].g},${stops[0].b})`;
      const last = stops[stops.length - 1];
      if (val >= last.v) return `rgb(${last.r},${last.g},${last.b})`;
      for (let i = 0; i < stops.length - 1; i++) {
        if (val >= stops[i].v && val <= stops[i + 1].v) {
          const t = (val - stops[i].v) / (stops[i + 1].v - stops[i].v);
          const r = Math.round(stops[i].r + t * (stops[i + 1].r - stops[i].r));
          const g = Math.round(stops[i].g + t * (stops[i + 1].g - stops[i].g));
          const b = Math.round(stops[i].b + t * (stops[i + 1].b - stops[i].b));
          return `rgb(${r},${g},${b})`;
        }
      }
    }

    const TEMP_S = [
      { v: -30, r: 0, g: 0, b: 160 }, { v: -10, r: 0, g: 100, b: 220 }, { v: 0, r: 0, g: 200, b: 210 },
      { v: 10, r: 30, g: 200, b: 80 }, { v: 20, r: 240, g: 220, b: 0 }, { v: 30, r: 255, g: 100, b: 0 }, { v: 40, r: 200, g: 0, b: 0 }
    ];
    const WIND_S = [
      { v: 0, r: 40, g: 190, b: 80 }, { v: 15, r: 240, g: 220, b: 0 }, { v: 25, r: 255, g: 130, b: 0 },
      { v: 40, r: 210, g: 0, b: 0 }, { v: 65, r: 140, g: 0, b: 200 }
    ];
    const PRES_S = [
      { v: 975, r: 200, g: 0, b: 0 }, { v: 1000, r: 255, g: 160, b: 0 }, { v: 1013, r: 40, g: 190, b: 80 },
      { v: 1025, r: 0, g: 160, b: 220 }, { v: 1040, r: 0, g: 50, b: 180 }
    ];
    const TEND_S = [
      { v: -6, r: 0, g: 0, b: 200 }, { v: -1, r: 100, g: 180, b: 230 }, { v: 0, r: 180, g: 180, b: 180 },
      { v: 1, r: 240, g: 180, b: 80 }, { v: 6, r: 200, g: 0, b: 0 }
    ];

    function contrastFg(rgb) {
      const m = rgb.match(/\d+/g);
      if (!m) return '#fff';
      const [r, g, b] = m.map(Number);
      return (r * 299 + g * 587 + b * 114) / 1000 < 130 ? '#ffffff' : '#111111';
    }

    function hexContrastFg(hex) {
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return (r * 299 + g * 587 + b * 114) / 1000 < 130 ? '#ffffff' : '#111111';
    }

    // ═══════════════════════════════════════════════════════════════
    // METAR PARSING
    // ═══════════════════════════════════════════════════════════════

    function parseVis(visib) {
      if (visib === null || visib === undefined) return null;
      if (visib === '10+') return 16000;
      const n = parseFloat(visib);
      if (isNaN(n)) return null;
      return Math.round(n * 1609.344);
    }

    function fmtVis(m) {
      if (m === null) return '—';
      if (m >= 9999) return '≥10 km';
      if (m >= 5000) return `${Math.round(m / 1000)} km`;
      return `${(m / 1000).toFixed(1)} km`;
    }

    // Normalize sky array: accepts both AWC format {cover,base} and SYNOP {skyCover,cloudBase}
    function normSky(obs) {
      // AWC METAR: obs.clouds = [{cover:'BKN', base:400}]
      // SYNOP:     obs.skyCondition = [{skyCover:'BKN', cloudBase:400}]
      const awc = obs.clouds || [];
      const syn = obs.skyCondition || [];
      const awcN = awc.map(c => ({ skyCover: c.cover, cloudBase: c.base }));
      // Merge, prefer AWC entries; SYNOP entries fill in
      return awcN.length ? awcN : syn;
    }

    function parseCeiling(sky) {
      if (!sky || !sky.length) return null;
      if (sky.some(s => ['SKC', 'CLR', 'NSC', 'CAVOK'].includes(s.skyCover))) return null;
      const layers = sky.filter(s => ['BKN', 'OVC', 'VV'].includes(s.skyCover) && s.cloudBase != null);
      if (!layers.length) return null;
      return Math.min(...layers.map(s => s.cloudBase));
    }

    function getCloudLayer(sky, minFt, maxFt) {
      if (!sky || !sky.length) return null;
      const all = sky.filter(s => {
        if (['SKC', 'CLR', 'NSC', 'CAVOK'].includes(s.skyCover)) return false;
        return s.cloudBase != null && s.cloudBase >= minFt && s.cloudBase < maxFt;
      });
      if (!all.length) return null;
      all.sort((a, b) => a.cloudBase - b.cloudBase);
      return all[0];
    }

    function parseQNH(altim) {
      if (!altim) return null;
      // AWC API returns hPa for Q-stations (>200), inHg for A-stations (<100)
      if (altim > 200) return Math.round(altim);
      return Math.round(altim * 33.8639);
    }

    // Color State: unlimited ceiling/vis = best possible
    function colorState(visMtr, ceilFt) {
      const v = visMtr ?? Infinity;
      const c = ceilFt ?? Infinity;
      for (const s of CS) {
        if (v >= s.vMtr && c >= s.cFt) return s;
      }
      return CS[CS.length - 1];
    }

    // Extract typed value from obs for a given param
    function extractVal(obs, pid) {
      switch (pid) {
        case 'visibility': return parseVis(obs.visib);
        case 'ceiling': return parseCeiling(normSky(obs));
        case 'colorstate': return colorState(parseVis(obs.visib), parseCeiling(normSky(obs)));
        case 'clouds_lo': {
          const sky = normSky(obs); const l = getCloudLayer(sky, 0, 6500);
          if (!l) return null;
          return { ...l, isEffectiveCeiling: ['BKN','OVC','VV'].includes(l.skyCover) };
        }
        case 'clouds_mi': {
          const sky = normSky(obs); const l = getCloudLayer(sky, 6500, 20000);
          if (!l) return null;
          const loCeil = sky.some(x => x.cloudBase < 6500 && ['BKN','OVC','VV'].includes(x.skyCover));
          return { ...l, isEffectiveCeiling: ['BKN','OVC','VV'].includes(l.skyCover) && !loCeil };
        }
        case 'clouds_hi': {
          const sky = normSky(obs); const l = getCloudLayer(sky, 20000, 99999);
          if (!l) return null;
          const loCeil = sky.some(x => x.cloudBase < 20000 && ['BKN','OVC','VV'].includes(x.skyCover));
          return { ...l, isEffectiveCeiling: ['BKN','OVC','VV'].includes(l.skyCover) && !loCeil };
        }
        case 'wind_barb': return { spd: obs.wspd ?? 0, dir: obs.wdir };
        case 'wind_dir': return (obs.wdir && obs.wdir !== 'VRB') ? parseInt(obs.wdir) : null;
        case 'wind_speed': return obs.wspd ?? null;
        case 'wind_gust': return obs.wgst ?? null;
        case 'pressure': return parseQNH(obs.altim) ?? (obs.slp ? Math.round(obs.slp) : null);
        case 'pres_tend': return obs.presTend ?? null;
        case 'ww': return obs.wxString || null;
        case 'temperature': return obs.temp ?? null;
        case 'dewpoint': return obs.dewp ?? null;
      }
      return null;
    }

    // Returns {bg, fg} for a given param+value
    function paramColor(pid, val) {
      const none = { bg: '#1a2535', fg: '#3a5570' };
      if (val === null || val === undefined) return none;

      switch (pid) {
        case 'visibility': {
          const s = colorState(val, Infinity); return { bg: s.bg, fg: s.fg };
        }
        case 'ceiling': {
          const s = colorState(Infinity, val); return { bg: s.bg, fg: s.fg };
        }
        case 'colorstate': {
          if (!val) return none; return { bg: val.bg, fg: val.fg };
        }
        case 'clouds_lo': case 'clouds_mi': case 'clouds_hi': {
          if (!val) return { bg: '#0d1a28', fg: '#2a4a6a' };
          if (!val.isEffectiveCeiling) return { bg: '#78909C', fg: '#ffffff' };
          return colorState(Infinity, val.cloudBase);
        }
        case 'wind_barb': case 'wind_speed': case 'wind_gust': {
          const spd = typeof val === 'object' ? val.spd : val;
          const bg = lerpColor(WIND_S, spd); return { bg, fg: contrastFg(bg) };
        }
        case 'wind_dir': return { bg: '#0d2840', fg: '#4ab8f0' };
        case 'pressure': {
          const bg = lerpColor(PRES_S, val); return { bg, fg: contrastFg(bg) };
        }
        case 'pres_tend': {
          const bg = lerpColor(TEND_S, val); return { bg, fg: contrastFg(bg) };
        }
        case 'ww': {
          // Aktives TS: TS am Wortanfang oder nach +/-/VC — NICHT RETS (vergangenes Gewitter)
          const wx = val.toLowerCase();
          if (/(?:^|[+\-]|vc)ts/.test(wx)) return { bg: '#4a0080', fg: '#e0a0ff' };
          if (wx.includes('sn') || wx.includes('sg')) return { bg: '#a0c4e0', fg: '#001040' };
          if (wx.includes('ra') || wx.includes('dz')) return { bg: '#0a3a7a', fg: '#80c8ff' };
          if (wx.includes('fzra') || wx.includes('fzdz')) return { bg: '#003060', fg: '#70e0ff' };
          if (wx.includes('fg') || wx.includes('br')) return { bg: '#30301a', fg: '#cccc80' };
          if (wx.includes('hz')) return { bg: '#4a4020', fg: '#ddcc80' };
          return { bg: '#1a2535', fg: '#7aaac0' };
        }
        case 'temperature': case 'dewpoint': {
          const bg = lerpColor(TEMP_S, val); return { bg, fg: contrastFg(bg) };
        }
      }
      return none;
    }

    // Format value to display string
    function fmtVal(pid, val) {
      if (val === null || val === undefined) return '—';
      switch (pid) {
        case 'visibility': return val >= 9999 ? '≥10' : val >= 5000 ? `${Math.round(val / 1000)}` : `${(val / 1000).toFixed(1)}`;
        case 'ceiling': return val != null ? `${String(Math.round(val / 100)).padStart(3, '0')}` : 'CAV';
        case 'colorstate': return val ? val.abbr : '?';
        case 'clouds_lo': case 'clouds_mi': case 'clouds_hi':
          return val ? `${val.skyCover}${String(Math.round(val.cloudBase / 100)).padStart(3, '0')}` : '—';
        case 'wind_barb': return null; // SVG only
        case 'wind_dir': return val != null ? `${val}°` : 'VRB';
        case 'wind_speed': case 'wind_gust': return val != null ? `${Math.round(val)}` : '—';
        case 'pressure': return val ? `${val}` : '—';
        case 'pres_tend': return val != null ? (val >= 0 ? `+${val.toFixed(1)}` : `${val.toFixed(1)}`) : '—';
        case 'ww': return val || '—';
        case 'temperature': case 'dewpoint': return val != null ? `${val.toFixed(1)}` : '—';
      }
      return '—';
    }

    // ═══════════════════════════════════════════════════════════════
    // WIND BARB SVG
    // ═══════════════════════════════════════════════════════════════

    function windBarbSVG(speedKt, dirRaw, clr = '#ffffff') {
      // Calm: circle only
      if (speedKt < 2.5) {
        return `<svg width="50" height="50" viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
      <circle r="8" fill="none" stroke="${clr}" stroke-width="1.8"/>
      <circle r="2.5" fill="${clr}"/>
    </svg>`;
      }
      const spd5 = Math.round(speedKt / 5) * 5;
      let rem = spd5;
      // Shaft: from station (0,0) upward to (-24 = tip of tail)
      // Feathers attach at tip and go downward along shaft; each feather extends
      // PERPENDICULAR to shaft = purely in +x direction
      const SHAFT_LEN = 24;
      const BARB_LEN = 12;   // full barb length (perpendicular)
      const HALF_LEN = 7;   // half barb
      const STEP = 5;   // spacing between barbs along shaft
      const els = [];
      els.push(`<circle cx="0" cy="0" r="2.5" fill="${clr}"/>`);
      els.push(`<line x1="0" y1="0" x2="0" y2="${-SHAFT_LEN}" stroke="${clr}" stroke-width="1.8"/>`);

      // Start placing barbs from the tip
      let y = -SHAFT_LEN;

      // Pennants (50 kt) – filled triangle, tip at shaft
      while (rem >= 50) {
        // Triangle: shaft point, barb end, and one step down the shaft
        els.push(`<polygon points="0,${y} ${BARB_LEN},${y} 0,${y + STEP}"
      fill="${clr}" stroke="none"/>`);
        y += STEP; rem -= 50;
      }
      // After pennants leave a small gap before barbs
      if (spd5 - rem > 0 && rem > 0) y += 2;

      // Full barbs (10 kt) – horizontal line to the right
      while (rem >= 10) {
        els.push(`<line x1="0" y1="${y}" x2="${BARB_LEN}" y2="${y}"
      stroke="${clr}" stroke-width="1.8" stroke-linecap="round"/>`);
        y += STEP; rem -= 10;
      }

      // Half barb (5 kt) – shorter, and if it is the only barb shift it slightly
      if (rem >= 5) {
        const yy = (spd5 === 5) ? y - 2 : y;
        els.push(`<line x1="0" y1="${yy}" x2="${HALF_LEN}" y2="${yy}"
      stroke="${clr}" stroke-width="1.8" stroke-linecap="round"/>`);
      }

      const dir = (!dirRaw || dirRaw === 'VRB') ? 0 : parseInt(dirRaw);
      const light = ['light', 'topo'].includes(activeTile);
      const filter = light
        ? `<defs><filter id="bf"><feMorphology operator="dilate" radius="0.6"/><feFlood flood-color="#ffffff" result="c"/><feComposite in="c" in2="SourceGraphic" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`
        : '';
      const gAttr = light ? ' filter="url(#bf)"' : '';
      return `<svg width="50" height="50" viewBox="-25 -25 50 50" xmlns="http://www.w3.org/2000/svg">
    ${filter}<g transform="rotate(${dir})"${gAttr}>${els.join('')}</g>
  </svg>`;
    }

    // ═══════════════════════════════════════════════════════════════
    // WMO PRESENT WEATHER SYMBOLS (SVG) — REVISED
    // ═══════════════════════════════════════════════════════════════

    const WX_CLR = {
      liq: '#00e090',  // grün  – flüssiger Niederschlag (RA, DZ, SH)
      snow: '#e0a0ff',  // lila  – fester Niederschlag (SN, SG, IC)
      haz: '#ff4444',  // rot   – Gefahren (FZ, TS, GR, SQ, FC)
      fog: '#ffb000',  // gelb  – Nebel / Sichteinschränkung (FG, BR, HZ)
      dust: '#d4a050',  // braun – Staub / Sand (DU, SA, PO)
    };

    function wxSvg(inner, w = 34, h = 34) {
      return `<svg width="22" height="22" viewBox="0 0 34 34"
    xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible;">${inner}</svg>`;
    }

    // ── Basis-Formen (Primitives) ────────────────────────────────

    function dot(cx, cy, clr, r = 2.6) {
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${clr}"/>`;
    }

    function comma(cx, cy, clr) {
      return `<circle cx="${cx}" cy="${cy}" r="1.8" fill="${clr}"/>` +
        `<path d="M${cx},${cy + 1.5} C${cx + 3},${cy + 4} ${cx + 1},${cy + 8} ${cx - 1},${cy + 8}" stroke="${clr}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
    }

    function star(cx, cy, clr, r = 4.5) {
      return [0, 60, 120].map(a => {
        const rd = a * Math.PI / 180, dx = r * Math.cos(rd), dy = r * Math.sin(rd);
        return `<line x1="${(cx - dx).toFixed(1)}" y1="${(cy - dy).toFixed(1)}" x2="${(cx + dx).toFixed(1)}" y2="${(cy + dy).toFixed(1)}" stroke="${clr}" stroke-width="1.8" stroke-linecap="round"/>`;
      }).join('');
    }

    // Dreiecke (Basis immer unten)
    function triFilled(cx, cy, clr, s = 6) { // GR (Hagel) - Komplett gefüllt
      return `<polygon points="${cx},${cy - s * 0.8} ${cx - s},${cy + s * 0.7} ${cx + s},${cy + s * 0.7}" fill="${clr}" stroke="${clr}" stroke-width="1"/>`;
    }

    function triEmpty(cx, cy, clr, s = 6) { // GS (Graupel) - Leer
      return `<polygon points="${cx},${cy - s * 0.8} ${cx - s},${cy + s * 0.7} ${cx + s},${cy + s * 0.7}" fill="none" stroke="${clr}" stroke-width="1.8" stroke-linejoin="round"/>`;
    }

    function triDot(cx, cy, clr, s = 6) { // PL/PE (Ice Pellets) - Leer mit Punkt
      return triEmpty(cx, cy, clr, s) + `<circle cx="${cx}" cy="${cy + s * 0.2}" r="1.5" fill="${clr}"/>`;
    }

    function vcParens(clr) {
      return `<path d="M8,4 Q2,17 8,30 M26,4 Q32,17 26,30" stroke="${clr}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    }

    // ── Positionsraster für Intensität ───────────────────────────

    function precipPos(intens) {
      if (intens === 'light') return [[12, 17], [22, 17]]; // 2 nebeneinander
      if (intens === 'moderate') return [[17, 12], [12, 21], [22, 21]]; // Dreieck
      return [[17, 8], [11, 17], [23, 17], [17, 26]]; // heavy = Raute
    }

    function precipPosFZ(intens) { // Nach rechts verschoben für die ~ Welle
      if (intens === 'light') return [[18, 17], [26, 17]];
      if (intens === 'moderate') return [[22, 12], [18, 21], [26, 21]];
      return [[18, 12], [26, 12], [18, 22], [26, 22]]; // heavy
    }

    // ── Komplexe Bausteine ───────────────────────────────────────

    function tsBolt(clr, heavy = false) { // WMO Blitz (TS)
      const yTop = 12;
      const vert = `<line x1="10" y1="${yTop}" x2="10" y2="30" stroke="${clr}" stroke-width="2.2" stroke-linecap="round"/>`;
      
      if (heavy) {
        // Schweres Gewitter (+TS): Ein Blitz mit extra Zickzack (ww=97/99)
        const zigzag = `<polyline points="8,${yTop} 26,${yTop} 18,17 24,21 15,26 25,30" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
        const arrow = `<polyline points="20,30 25,30 25,25" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
        return vert + zigzag + arrow;
      } else {
        // Normales Gewitter (TS): Einfacher Zickzack
        const zigzag = `<polyline points="8,${yTop} 26,${yTop} 16,21 26,30" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
        const arrow = `<polyline points="21,30 26,30 26,25" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
        return vert + zigzag + arrow;
      }
    }
    
    function showerTri(clr, intens) { // Schauer-Dreieck (Spitze unten)
      const tri = `<polygon points="10,13 24,13 17,29" fill="none" stroke="${clr}" stroke-width="2" stroke-linejoin="round"/>`;
      let bars = '';
      if (intens === 'moderate') bars = `<line x1="13" y1="20" x2="21" y2="20" stroke="${clr}" stroke-width="2"/>`;
      if (intens === 'heavy') bars = `<line x1="12" y1="18" x2="22" y2="18" stroke="${clr}" stroke-width="2"/><line x1="14" y1="23" x2="20" y2="23" stroke="${clr}" stroke-width="2"/>`;
      return tri + bars;
    }

    function fogLines(type, clr) {
      const line = (y, dash = false) => `<line x1="5" y1="${y}" x2="29" y2="${y}" stroke="${clr}" stroke-width="2.2" stroke-linecap="round" ${dash ? 'stroke-dasharray="7,5"' : ''}/>`;
      const splitLine = (y) => `<path d="M5,${y} L14,${y} M20,${y} L29,${y}" stroke="${clr}" stroke-width="2.2" stroke-linecap="round"/>`;

      if (type === 'BR') return line(13) + line(21);
      if (type === 'MIFG') return line(13, true) + line(21);
      if (type === 'BCFG') return splitLine(11) + line(17) + splitLine(23); // Oben/Unten Lücke, Mitte durchgezogen
      if (type === 'PRFG') return splitLine(11) + line(17) + line(23);      // Nur oben Lücke
      if (type === 'FZFG') return line(11) + line(17) + line(23) + `<polyline points="12,11 17,23 22,11" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linejoin="round"/>`;
      return line(11) + line(17) + line(23); // Normal FG
    }

    function freezingS(intens, isRain, clr) {
      // Liegendes S (Tilde)
      const sPath = `<path d="M6,17 C6,7 17,7 17,17 C17,27 28,27 28,17" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
      const leftDrop = isRain ? dot(11.5, 12, clr) : comma(11.5, 12, clr);
      const rightDrop = isRain ? dot(22.5, 22, clr) : comma(22.5, 22, clr);

      // Bei leicht (-) nur links, bei moderat/stark beidseitig
      return sPath + leftDrop + (intens === 'light' ? '' : rightDrop);
    }

    function blowingArrows(clr, isDrifting) {
      // Pfeil horizontal nach rechts
      const hArr = `<path d="M9,17 L25,17 M21,13 L25,17 L21,21" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      // Pfeil vertikal (BLSN = Spitze unten, DRSN = Spitze oben)
      const vArr = isDrifting
        ? `<path d="M17,25 L17,9 M13,13 L17,9 L21,13" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
        : `<path d="M17,9 L17,25 M13,21 L17,25 L21,21" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      return hArr + vArr;
    }

    function snowCross(clr, isDrifting) {
      // Waagerechter Pfeil nach rechts
      const hLine = `<path d="M6,17 L26,17 M21,12 L26,17 L21,22" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      // Senkrechter Pfeil (isDrifting = DRSN = Spitze oben | BLSN = Spitze unten)
      const vLine = isDrifting
        ? `<path d="M16,27 L16,7 M11,12 L16,7 L21,12" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
        : `<path d="M16,7 L16,27 M11,22 L16,27 L21,22" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      return hLine + vLine;
    }

    function dustStorm(clr, heavy = false) {
      // Stehendes S
      const sPath = `<path d="M22,10 C22,5 12,5 12,11 C12,16 22,18 22,23 C22,29 12,29 12,24" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
      let arrows;
      if (heavy) {
        // Doppelpfeil (=>)
        arrows = `<path d="M7,14 L24,14 M7,20 L24,20 M20,9 L27,17 L20,25" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      } else {
        // Einfacher Pfeil (->)
        arrows = `<path d="M9,17 L25,17 M21,13 L25,17 L21,21" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
      return sPath + arrows;
    }

    function dustDevil(clr) { // PO (Dust Devil) - 3-fache Spirale
      // Ein durchgehender Pfad für eine 3-Loop-Spirale von unten nach oben
      const path = `M12,24 C12,30 22,30 22,24 C22,18 12,22 12,16 C12,22 22,22 22,16 C22,10 12,14 12,8 C12,14 22,14 22,8`;
      return `<path d="${path}" stroke="${clr}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    }

    // ═══════════════════════════════════════════════════════════════
    // MAIN BUILDER
    // ═══════════════════════════════════════════════════════════════

    function wxSymbolSVG(wxStr) {
      if (!wxStr || wxStr === 'CAVOK') return null;
      const wx = wxStr.toUpperCase().trim();
      const heavy = wx.includes('+');
      const light = wx.includes('-');
      const intens = heavy ? 'heavy' : light ? 'light' : 'moderate';
      const isVC = wx.includes('VC');
      const { liq, snow, haz, fog, dust } = WX_CLR;

      // 1. Extreme Hazards
      if (wx.includes('FC')) return wxSvg(`<path d="M7,7 C17,10 17,20 12,28 M27,7 C17,10 17,20 22,28" stroke="${haz}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`);
      if (wx.includes('SQ')) return wxSvg(
        `<path d="M8,10 L17,28 L26,10 Q17,16 8,10 Z" stroke="${haz}" stroke-width="2.4" fill="none" stroke-linejoin="round"/>`
      ); if (wx.includes('PO')) {
        // PO und VCPO bekommen BEIDE das gleiche Spiralen-Symbol OHNE Klammern
        return wxSvg(dustDevil(dust));
      }

      // 2. Thunderstorms (TS)
      if (wx.includes('TS')) {
        // VCTS - Blitz ohne Gewitter an der Station (ww=13)
        if (isVC && !wx.includes('SH') && !wx.includes('RA') && !wx.includes('SN') && !wx.includes('GR') && !wx.includes('GS') && !wx.includes('PL') && !wx.includes('PE') && !wx.includes('DZ')) {
          return wxSvg(
            `<polyline points="23,8 13,18 21,27" stroke="${haz}" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>` +
            `<polyline points="16,27 21,27 21,22" stroke="${haz}" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`
          );
        }

        // heavy Parameter an den Blitz übergeben
        let inner = tsBolt(haz, heavy);

        // Niederschlagssymbole in der Y-Achse nach oben gesetzt (cy = 4.5 bis 6)
        if (wx.includes('RA')) inner += dot(17, 4.5, liq, 2.5);
        else if (wx.includes('SN')) inner += star(17, 5, snow, 3.5);
        else if (wx.includes('GR')) inner += triFilled(17, 6, haz, 3.5);
        else if (wx.includes('GS')) inner += triEmpty(17, 6, haz, 3.5);
        else if (wx.includes('PL') || wx.includes('PE')) inner += triDot(17, 6, haz, 3.5);
        else if (wx.includes('DZ')) inner += comma(17, 4.5, liq);

        if (isVC && !wx.includes('SH')) return wxSvg(inner + vcParens(haz));
        return wxSvg(inner);
      }

      // 3. Showers (SH)
      if (wx.includes('SH') || (isVC && (wx.includes('RA') || wx.includes('SN') || wx.includes('GR')))) {
        let sColor = wx.includes('SN') ? snow : liq;
        if (wx.includes('GR') || wx.includes('GS') || wx.includes('PL') || wx.includes('PE')) sColor = haz;

        let inner = showerTri(sColor, intens);
        if (wx.includes('GR')) inner += triFilled(17, 6, haz, 3.5); // Fehler behoben
        else if (wx.includes('GS')) inner += triEmpty(17, 6, haz, 3.5);  // Fehler behoben
        else if (wx.includes('PL') || wx.includes('PE')) inner += triDot(17, 6, haz, 3.5); // Fehler behoben
        else if (wx.includes('SN')) inner += star(17, 6, snow, 3.5);
        else if (wx.includes('RA') || !wx.includes('SH')) inner += dot(17, 6, liq, 2.5);

        if (isVC) return wxSvg(inner + vcParens(sColor));
        return wxSvg(inner);
      }

      // 4. Freezing (FZ)
      if (wx.includes('FZ')) {
        if (wx.includes('RA')) return wxSvg(freezingS(intens, true, haz));
        if (wx.includes('DZ')) return wxSvg(freezingS(intens, false, haz));
        if (wx.includes('FG')) return wxSvg(fogLines('FZFG', haz));
      }

      // 5. Solid Precip
      if (wx.includes('PL') || wx.includes('PE')) {
        // Ein großes, leeres Dreieck mit Punkt in der Mitte
        return wxSvg(
          `<polygon points="17,9 9,25 25,25" fill="none" stroke="${haz}" stroke-width="2.2" stroke-linejoin="round"/>` +
          `<circle cx="17" cy="20" r="2.5" fill="${haz}"/>`
        );
      }
      if (wx.includes('GR')) {
        // Ein großes, komplett rot gefülltes Dreieck
        return wxSvg(
          `<polygon points="17,9 9,25 25,25" fill="${haz}" stroke="${haz}" stroke-width="2" stroke-linejoin="round"/>`
        );
      }
      if (wx.includes('GS')) {
        // Ein großes, leeres Dreieck
        return wxSvg(
          `<polygon points="17,9 9,25 25,25" fill="none" stroke="${haz}" stroke-width="2.2" stroke-linejoin="round"/>`
        );
      }

      // ── SNOW TYPES ───────────────────────────────────────────────

      if (wx.includes('IC')) {
        // Waagerechter Strich mit sich kreuzenden Diagonalen (Stern)
        return wxSvg(
          `<line x1="5" y1="17" x2="29" y2="17" stroke="${snow}" stroke-width="2.4" stroke-linecap="round"/>` +
          `<line x1="12" y1="10" x2="22" y2="24" stroke="${snow}" stroke-width="2.2" stroke-linecap="round"/>` +
          `<line x1="22" y1="10" x2="12" y2="24" stroke="${snow}" stroke-width="2.2" stroke-linecap="round"/>`
        );
      }

      if (wx.includes('SG')) {
        // Waagerechter Strich, der durch ein leeres, nach oben zeigendes Dreieck schneidet
        return wxSvg(
          `<line x1="5" y1="17" x2="29" y2="17" stroke="${snow}" stroke-width="2.4" stroke-linecap="round"/>` +
          `<polygon points="17,7 9,21 25,21" fill="none" stroke="${snow}" stroke-width="2.2" stroke-linejoin="round"/>`
        );
      }

      // 5. Mixed Precip & Blowing/Drifting (MUSS vor "Pure Rain/Snow" stehen!)
      if (wx.includes('RASN') || wx.includes('SNRA')) {
        return wxSvg(star(17, 8, snow, 4) + dot(17, 17, liq, 3) + star(17, 26, snow, 4));
      }
      if (wx.includes('RADZ') || wx.includes('DZRA')) {
        return wxSvg(dot(17, 8, liq, 3) + comma(17, 17, liq) + dot(17, 26, liq, 3));
      }

      // 6. Blowing / Drifting Snow (Kreuz-Pfeile)
      if (wx.includes('BLSN') || wx.includes('VCBLSN')) {
        // BLSN und VCBLSN erhalten beide das gleiche Kreuz-Pfeil-Symbol ohne Klammern
        return wxSvg(snowCross(snow, false));
      }

      if (wx.includes('DRSN')) {
        // Drifting Snow (Spitze nach oben)
        let inner = snowCross(snow, true);
        // Falls VCDRSN vorkommen sollte, bliebe es hier bei den Klammern, 
        // ansonsten wird einfach nur das Symbol gezeichnet.
        if (isVC) return wxSvg(inner + vcParens(snow));
        return wxSvg(inner);
      }

      // 7. Pure Rain/Snow/Drizzle & Virga
      if (wx.includes('SN')) {
        const p = precipPos(intens); return wxSvg(p.map(([x, y]) => star(x, y, snow)).join(''));
      }
      if (wx.includes('RA')) {
        const p = precipPos(intens); return wxSvg(p.map(([x, y]) => dot(x, y, liq)).join(''));
      }
      if (wx.includes('DZ')) {
        const p = precipPos(intens); return wxSvg(p.map(([x, y]) => comma(x, y, liq)).join(''));
      }
      if (wx.includes('VIRGA')) {
        return wxSvg(
          `<path d="M10,19 C14,26 20,26 24,19" stroke="${liq}" stroke-width="2.2" fill="none" stroke-linecap="round"/>` + dot(17, 12, liq)
        );
      }

      // 8. Obscurations (Nebel etc.)
      if (wx.includes('MIFG')) return wxSvg(fogLines('MIFG', fog));
      if (wx.includes('BCFG')) return wxSvg(fogLines('BCFG', fog));
      if (wx.includes('PRFG')) return wxSvg(fogLines('PRFG', fog));
      if (wx.includes('VCFG')) return wxSvg(fogLines('VCFG', fog) + vcParens(fog));
      if (wx.includes('FG')) return wxSvg(fogLines('FG', fog));
      if (wx.includes('BR')) return wxSvg(fogLines('BR', fog));
      if (wx.includes('HZ')) return wxSvg(`<path d="M8,17 C8,10 17,10 17,17 C17,24 26,24 26,17 C26,10 17,10 17,17 C17,24 8,24 8,17" stroke="${fog}" stroke-width="2" fill="none"/>`);

      // 9. Smoke, Dust & Sand
      if (wx.includes('FU') || wx.includes('VA')) return wxSvg(
        `<path d="M8,26 L8,10 C8,6 14,6 14,10 C14,14 20,14 20,10 C20,6 26,6 26,10" stroke="#999" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
      );

      // SS, DS, DRSA, DRDU, VCSS, VCDS - Stehendes S durchgestrichen mit Pfeil
      // (+SS/+DS werden durch die Variable "heavy" in der Funktion mit Doppelpfeil gezeichnet)
      if (wx.includes('SS') || wx.includes('DS') || wx.includes('DRSA') || wx.includes('DRDU')) {
        let inner = dustStorm(dust, heavy);
        if (isVC) return wxSvg(inner + vcParens(dust));
        return wxSvg(inner);
      }

      // SA, BLSA, BLDU, BLPY, VCSA - Stehendes S mit senkrechtem Strich ($)
      if (wx.includes('BLDU') || wx.includes('BLSA') || wx.includes('SA') || wx.includes('BLPY') || wx.includes('VCSA')) {
        const sPath = `M22,10 C22,5 12,5 12,11 C12,16 22,18 22,23 C22,29 12,29 12,24`;
